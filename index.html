<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Ne(r)d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f3; --border:rgba(14,17,22,.08);
  --text:#0e1116; --text-2:#525a66; --muted:#8a919c;
  --accent:#2e5bff; --accent-2:#7b5cff; --route:#2e5bff; --gold:#e0a100; --sun:#ffc531;
  --sea:#0e1116; --snow:#ffffff; --contour:transparent; --grid:rgba(14,17,22,.08);
  --p0:#2a78d6; --p1:#eb6834; --p2:#1baf7a; --p3:#eda100; --p4:#e87ba4;
  --r-xl:32px; --r-l:24px; --r-m:16px;
  --display:"Inter Tight","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:where(:not([data-theme="light"])){
  color-scheme: dark; --bg:#0a0c10; --surface:#14171d; --surface-2:#1c2028; --border:rgba(255,255,255,.08);
  --text:#f3f5f8; --text-2:#aab1bc; --muted:#7c8491; --accent:#5b7cff; --route:#5b7cff; --grid:rgba(255,255,255,.08);
  --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181; } }
:root[data-theme="dark"]{ color-scheme: dark; --bg:#0a0c10; --surface:#14171d; --surface-2:#1c2028; --border:rgba(255,255,255,.08);
  --text:#f3f5f8; --text-2:#aab1bc; --muted:#7c8491; --accent:#5b7cff; --route:#5b7cff; --grid:rgba(255,255,255,.08);
  --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:32px 20px 80px}
h1,h2,h3,.big,.hero-name,.rank,.score,.dnum,.pname,.pc-name,.trophy-m,.ch-t,.pstat .big{font-family:var(--display);letter-spacing:-.035em}
h1{font-size:clamp(44px,8vw,84px);line-height:1;font-weight:800;margin:0}
h1 .paren{color:var(--accent)}
h2{font-size:clamp(28px,4vw,40px);line-height:1.05;font-weight:800;margin:0}
h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.sub{color:var(--text-2);margin:14px 0 0;font-size:18px;max-width:40ch}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:0;border-radius:999px;padding:8px 14px;font:500 14px Inter,sans-serif;color:var(--text-2);display:inline-flex;align-items:center}
button.chip{cursor:pointer}
.chip.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:8px;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.chip.live::before{animation:none}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* tabs */
.tabs{position:sticky;top:12px;z-index:20;display:flex;gap:4px;padding:6px;margin:0 0 28px;background:color-mix(in oklab,var(--surface) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;box-shadow:0 8px 30px rgba(14,17,22,.08);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:600 15px Inter,sans-serif;color:var(--text-2);background:transparent;border:0;border-radius:999px;padding:11px 18px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--text);color:var(--bg)}

/* generic */
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.gday{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);margin-top:16px;align-items:start}
@media (max-width:820px){.gday{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r-l);padding:24px}
section{margin-top:48px}
section:first-of-type{margin-top:0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-head p{margin:0;color:var(--text-2);font-size:15px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.name{display:inline-flex;align-items:center;font-weight:600;white-space:nowrap}
.wholist{display:inline-flex;flex-wrap:wrap;gap:6px 14px}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font:700 11px Inter,sans-serif;margin-right:9px;flex:none}
.av.sm{width:20px;height:20px;font-size:9px;margin-right:0;box-shadow:0 0 0 2px var(--surface)}
.av.xl{width:68px;height:68px;font-size:22px;margin:0 0 6px}
.av.xxl{width:92px;height:92px;font-size:30px;margin:0}
.btn{font:600 14px Inter,sans-serif;background:var(--surface);color:var(--text);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-variant-numeric:tabular-nums}
.pill.p5{background:var(--sun);color:#0e1116}
.pill.star{background:color-mix(in oklab,var(--sun) 35%,var(--surface));color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--text-2);margin-bottom:12px}
.legend .av.sm{margin-right:6px;box-shadow:none}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.raw{font-weight:600;font-variant-numeric:tabular-nums}
.absent{color:var(--muted)}
.tiles{display:flex;gap:3px;margin-top:7px}
.tiles i{display:block;width:16px;height:16px;border-radius:5px}

/* day nav */
.daynav{display:flex;align-items:center;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.navbtn{font:600 18px Inter,sans-serif;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);color:var(--text);cursor:pointer}
.navbtn:hover{background:var(--surface-2)}
.navbtn:disabled{opacity:.3;cursor:default}
.dlabel{display:flex;flex-direction:column;min-width:0}
.dnum{font-weight:800;font-size:30px;line-height:1.05}
.ddate{color:var(--text-2);font-size:15px}
.daynav-side{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* missing */
.missing{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:color-mix(in oklab,var(--sun) 28%,var(--surface));border-radius:var(--r-m);padding:14px 18px;margin-bottom:16px}
.missing.done{background:color-mix(in oklab,#22c55e 20%,var(--surface));font-weight:600}
.missing-t{font-weight:700}
.missing-list{display:flex;flex-wrap:wrap;gap:8px 18px}
.miss-item{display:inline-flex;align-items:center;gap:6px}

/* hero (scuro, stile app) */
.hero{--text:#ffffff;--text-2:rgba(255,255,255,.72);--muted:rgba(255,255,255,.55);--surface:rgba(255,255,255,.08);--surface-2:rgba(255,255,255,.12);--border:rgba(255,255,255,.1);--sea:#0e1116;--snow:#fff;
  position:relative;overflow:hidden;border-radius:var(--r-xl);background:#0e1116;color:var(--text);padding:32px 32px 0;margin-top:0}
.hero::before{content:"";position:absolute;inset:auto -10% -40% 30%;height:120%;background:radial-gradient(closest-side,rgba(46,91,255,.55),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:-30% 50% auto -15%;height:90%;background:radial-gradient(closest-side,rgba(123,92,255,.35),transparent 70%);pointer-events:none}
.hero > svg.topo{display:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px 28px;align-items:end}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}
.hero-text{padding-bottom:32px}
.hero-title{margin:0;font-weight:600;color:var(--text-2)}
.hero-name{font-size:clamp(48px,7vw,80px);line-height:1;font-weight:800;margin:6px 0 0}
.hero-note{margin:10px 0 0;font-size:17px;color:var(--text-2)}
.markers{display:grid;gap:8px;margin-top:24px}
.marker{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r-m);padding:12px 16px;backdrop-filter:blur(8px)}
.marker .ico{font-size:20px;width:26px;text-align:center}
.marker .lbl{font-size:13px;color:var(--muted)}
.marker .val{font-weight:600}
.podium svg{display:block;width:100%;height:auto}

/* headlines + share */
.headlines{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.headlines li{display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.35}
.headlines .hi{flex:none;width:38px;height:38px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px}
.ticket{background:var(--surface);border-radius:var(--r-l);padding:24px}
.share{white-space:pre-wrap;font:14px/1.6 Inter,sans-serif;background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;margin:0 0 14px}

/* challenge */
.challenge{--text:#fff;--text-2:rgba(255,255,255,.78);--muted:rgba(255,255,255,.6);--surface:rgba(255,255,255,.14);
  margin-top:16px;border-radius:var(--r-xl);padding:28px;color:#fff;background:linear-gradient(135deg,#2e5bff 0%,#7b5cff 60%,#b05cff 100%);position:relative;overflow:hidden}
.challenge .av{box-shadow:none}
.ch-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start}
.ch-ico{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:30px}
.ch-kick{font-size:14px;font-weight:600;color:rgba(255,255,255,.8)}
.ch-t{font-size:clamp(30px,4.5vw,44px);font-weight:800;margin:2px 0 6px;color:#fff}
.ch-d{margin:0;font-size:16px;max-width:60ch;color:rgba(255,255,255,.85)}
.ch-left{text-align:center;line-height:1;background:rgba(255,255,255,.14);border-radius:18px;padding:12px 16px}
.ch-left .big{display:block;font-size:40px;font-weight:800}
.ch-left small{font-size:12px;color:rgba(255,255,255,.8)}
.ch-rows{display:grid;gap:12px;margin-top:22px}
.ch-row{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center}
.ch-bar{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.18)}
.ch-bar i{display:block;height:100%;border-radius:6px;min-width:4px;box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}
.ch-target{position:absolute;top:-5px;width:3px;height:22px;background:#fff;border-radius:2px}
.ch-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-foot{font-size:13px;margin:16px 0 0;color:rgba(255,255,255,.75)}
@media (max-width:600px){.ch-head{grid-template-columns:auto 1fr}.ch-left{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;text-align:left}.ch-left .big{display:inline;font-size:26px}.ch-row{grid-template-columns:110px 1fr auto}.challenge{padding:22px}}

/* leaderboard */
.board{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:16px 22px;border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.row[role=button]{cursor:pointer}
.row[role=button]:hover{background:var(--surface-2)}
.row.first .rank{background:var(--sun);color:#0e1116}
.rank{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--text-2)}
.who-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who-line .name{font-size:18px}
.stats{font-size:14px;color:var(--text-2);margin-top:2px}
.track{height:8px;background:var(--surface-2);border-radius:4px;margin-top:10px;overflow:hidden}
.track > i{display:block;height:100%;border-radius:4px}
.score{font-size:40px;font-weight:800;line-height:1;text-align:right}
.score small{display:block;font:500 12px Inter,sans-serif;letter-spacing:0;color:var(--muted)}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--surface);border-radius:999px}
.seg button{font:600 14px Inter,sans-serif;border:0;background:transparent;color:var(--text-2);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg)}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px rgba(14,17,22,.18);min-width:160px;display:none;z-index:5}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.h2h td,.h2h th{text-align:center;font-variant-numeric:tabular-nums}
.h2h td.self{color:var(--muted)}
.h2h td.win{font-weight:800;color:var(--accent)}

/* calendar */
.calwrap{grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);align-items:start;gap:28px}
.calwrap section{margin-top:0}
@media (max-width:860px){.calwrap{grid-template-columns:1fr}}
.months{grid-template-columns:1fr}
.month h3{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal-c{aspect-ratio:1/1.05;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font:600 12px Inter,sans-serif;color:var(--muted);border:0}
.cal-c.empty{background:transparent}
.cal-c.future{opacity:.4}
.cal-c.has{background:var(--bg);color:var(--text);cursor:pointer}
.cal-c.has:hover{outline:2px solid var(--accent)}
.cal-c.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal-c.sel{background:color-mix(in oklab,var(--accent) 16%,var(--surface))}
.cal-c .n{align-self:flex-start;padding-left:6px}
.cal-w{display:flex}
.cal-w .av.sm:nth-child(2){margin-left:-6px}
.cal-s{font-size:8px;line-height:1}
.wk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.wk:last-child{border-bottom:0}
.wk-d{font-weight:700}
.wk-w{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* games */
.game-card h3{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em}
.record{background:var(--surface-2);border-radius:var(--r-m);padding:14px 16px;margin:6px 0 14px}
.record .big{font-size:32px;font-weight:800;line-height:1.1}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);gap:10px;font-size:14px}
.stat-row:last-child{border-bottom:none}
.dist{display:flex;gap:2px;height:12px;flex:1;min-width:90px;max-width:180px}
.dist i{display:block;height:100%}
.dist i:first-child{border-radius:6px 0 0 6px}.dist i:last-child{border-radius:0 6px 6px 0}
.legend-mini{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);margin:2px 0 10px}
.legend-mini span{display:inline-flex;align-items:center;gap:5px}
.legend-mini b{display:inline-block;width:10px;height:10px;border-radius:3px}

/* awards + honors */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.badge{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-l);background:var(--surface)}
.badge .ico{flex:none;width:50px;height:50px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:24px}
.badge .t{font-weight:700}
.badge .who{margin-top:4px}
.badge .why{font-size:13px;color:var(--text-2);margin-top:4px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.trophy{background:linear-gradient(160deg,#fff3c4,#ffd76a);color:#0e1116;border-radius:var(--r-l);padding:22px;text-align:center;--text:#0e1116;--text-2:#4a4f57;--muted:#6b6f75}
.trophy.live{background:var(--surface);color:var(--text);--text:inherit}
.trophy-cup{font-size:46px;line-height:1}
.trophy-m{font-weight:800;font-size:22px;margin-top:8px}
.trophy-w{margin:10px 0;display:flex;justify-content:center}
.trophy-pod{list-style:none;padding:0;margin:8px 0 0;font-size:13px;display:grid;gap:3px}

/* players */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{font:inherit;color:inherit;text-align:center;background:var(--surface);border:0;border-radius:var(--r-l);padding:26px 16px 20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden;transition:transform .15s}
.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:70px;background:linear-gradient(180deg,color-mix(in oklab,var(--pc) 30%,transparent),transparent)}
.pcard > *{position:relative}
.pcard:hover{transform:translateY(-2px)}
.pc-name{font-weight:800;font-size:26px;line-height:1.05}
.pc-sub{font-size:14px;color:var(--text-2)}
.pc-troph{font-size:13px;white-space:pre}
.form{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;justify-content:center}
.card .form{justify-content:flex-start}
.fpos{width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font:700 12px Inter,sans-serif;background:var(--surface-2);color:var(--muted)}
.fpos.p1{background:var(--sun);color:#0e1116}
.fpos.p2{background:color-mix(in oklab,var(--text) 18%,var(--surface));color:var(--text)}
.fpos.p3{background:color-mix(in oklab,#d4894a 35%,var(--surface));color:var(--text)}
.phero{background:var(--surface);border-radius:var(--r-xl);padding:28px;margin-top:0;position:relative;overflow:hidden}
.phero::before{content:"";position:absolute;inset:-40% -10% auto 40%;height:120%;background:radial-gradient(closest-side,color-mix(in oklab,var(--pc) 35%,transparent),transparent 70%);pointer-events:none}
.phero > *{position:relative}
.phero-id{display:flex;gap:20px;align-items:center}
.pname{font-size:clamp(40px,7vw,64px);font-weight:800;line-height:1}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:22px}
.pstat{background:var(--surface-2);border-radius:var(--r-m);padding:12px 14px}
.pstat .big{font-weight:800;font-size:30px;line-height:1.1}
.pstat .muted{font-size:13px}
.ptroph{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-weight:600}
.g2p{grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-top:16px;align-items:start}

/* misc */
.empty{padding:40px;text-align:center;color:var(--text-2)}
.empty .big{font-size:44px;font-weight:800;color:var(--text);margin-bottom:6px}
.warn{box-shadow:inset 5px 0 0 var(--sun)}
.warn li{margin:4px 0}
.warn code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.rules li{margin:8px 0;color:var(--text-2)}
footer{margin-top:48px;color:var(--muted);font-size:13px}
@media (max-width:560px){
  .wrap{padding:22px 14px 60px}
  .tab{padding:10px 13px;font-size:14px}
  .daynav-side{margin-left:0;width:100%}

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Ne<span class="paren">(</span>r<span class="paren">)</span>d</h1>
      <p class="sub">Farhike, City Angle e Travle: ogni giorno una nuova mappa da conquistare.</p>
    </div>
    <div class="chips"><span class="chips" id="chips"></span><button class="chip" id="themeBtn" title="Tema chiaro/scuro">◐ Tema</button></div>
  </header>

  <div id="app"></div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGE_FnnI2V_FOY55s4-fTdM9xESB0zevdxlIjtZxYKOOXjcHdZkYMTLTuI9nVF3l9GATOPGHWNPnHE/pub?gid=1155406161&single=true&output=csv"; // link "Pubblica sul web" dello sheet, formato CSV
const D = Object.assign({csv:"", updatedAt:null, live:false}, window.DAILY_NERD||{});
const GAMES = ["Farhike","City Angle","Travle"];
const GAME_ICON = {"Farhike":"🏔️","City Angle":"🧭","Travle":"🗺️"};
const POINTS = [5,3,2,1,0];
const BONUS = 1; // punto extra per una partita perfetta
const CATS = {
  "Farhike":   [["⬛","Mancato","#2e3338",0],["⬜","Comune","#b4bac0",1],["🟩","Non comune","#3aa757",2],["🟦","Raro","#2f6fd6",3],["🟪","Sfuggente","#8b4fd1",4],["🟧","Pioniere","#ef8a1f",5]],
  "City Angle":[["🟩","Al primo tentativo","#3aa757"],["🟨","Al secondo","#f2c230"],["🟧","Al terzo","#ef8a1f"],["🟥","Al quarto","#d9402f"],["🟪","Al quinto o oltre","#8b4fd1"],["⬛","Non trovata","#2e3338"]],
  "Travle":    [["✅","Perfetto","#12a150"],["🟩","Giusto","#8fd17e"],["🟧","Non necessario","#ef8a1f"],["🟥","Sbagliato","#d9402f"]]
};
const STAR_RULE = {"Farhike":"tutti e 5 i paesi trovati, nessun ⬛","City Angle":"3 città al primo tentativo, 🟩🟩🟩","Travle":"percorso perfetto, +0"};
function strip(raw, g){
  const set=CATS[g].map(c=>c[0]);
  const t=raw.replace(/◻️|◻|🔲|🔳|▫️|⬜️/g,"⬜").replace(/✅️/g,"✅");
  const arr=Array.from(t).filter(ch=>set.includes(ch));
  const counts={}; arr.forEach(ch=>counts[ch]=(counts[ch]||0)+1);
  return {arr, str:arr.join(""), counts};
}
const app = document.getElementById("app");

/* ---------- theme ---------- */
try{const t=localStorage.getItem("nerd-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx;
  try{localStorage.setItem("nerd-theme",nx);}catch(e){}
  render();
};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="style") n.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
  return n;
}
const fmt = (n,d=0)=> Number(n).toLocaleString("it-IT",{maximumFractionDigits:d,minimumFractionDigits:0});
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function dParts(iso){const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d));}
function dLong(iso){const dt=dParts(iso); return GIORNI[dt.getUTCDay()]+" "+dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}
function dShort(iso){const dt=dParts(iso); return dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function normDate(s){
  s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return null;
}
function numbers(t){ return [...t.matchAll(/\d+(?:[.,]\d+)?/g)].map(x=>parseFloat(x[0].replace(",","."))); }

/* ---------- parsers: each returns {score (higher is better), show, extra:{}} or null ---------- */
const PARSE = {
  "Farhike"(raw){
    const t=raw.replace(/https?:\/\/\S+|\S+\.(com|earth)\S*/gi," ").replace(/#\s*\d+/g," ");
    let v=null, m=t.match(/(\d+(?:[.,]\d+)?)\s*\/\s*500/);
    if(m) v=parseFloat(m[1].replace(",","."));
    if(v==null){ const km=[...t.matchAll(/(\d{1,3}(?:[.,]\d+)?)\s*km/gi)].map(x=>parseFloat(x[1].replace(",","."))).filter(n=>n<500); if(km.length) v=Math.max(...km); }
    if(v==null){ const ns=numbers(t).filter(n=>n<=500); if(ns.length) v=Math.max(...ns); }
    if(v==null) return null;
    const st=strip(raw,"Farhike");
    const w=Object.fromEntries(CATS.Farhike.map(c=>[c[0],c[3]]));
    const rarity=st.arr.reduce((a,ch)=>a+w[ch],0);
    const star = st.arr.length>=5 && !st.counts["⬛"];
    return {score:v+rarity/1000, show:fmt(v,1)+" km", strip:st.str, extra:{km:v, counts:st.counts, rarity, star}};
  },
  "City Angle"(raw){
    const t=raw.replace(/https?:\/\/\S+/gi," ");
    let v=null; const m=t.match(/(\d[\d.,\s]*)\s*pts?\b/i);
    if(m) v=parseInt(m[1].replace(/\D/g,""),10);
    const sv=t.match(/solved\s+(?:all\s+)?(\d)/i), gs=t.match(/(\d+)\s+guess/i);
    const ft=t.match(/(\d)\s*\/\s*5\s*first/i);
    if(v==null){ const ns=numbers(t.replace(/\d\s*\/\s*5/g," ")); if(ns.length) v=Math.max(...ns); }
    if(v==null||isNaN(v)) return null;
    const solved=sv?+sv[1]:null, guesses=gs?+gs[1]:null;
    const sub = guesses!=null? `${solved??"?"}/3 città in ${guesses} tentativi` : (ft? `${ft[1]}/5 al primo colpo`:"");
    const st=strip(raw,"City Angle");
    const star = (st.arr.length===3 && st.arr.every(c=>c==="🟩")) || (guesses===3&&solved===3);
    return {score:v+(guesses!=null?(50-guesses)/1000:0), show:fmt(v)+" pts", sub, strip:st.str, extra:{pts:v, solved, guesses, counts:st.counts, star}};
  },
  "Travle"(raw){
    const t=raw.replace(/https?:\/\/\S+/gi," ").replace(/#travle\w*/gi," ").replace(/#\s*\d+/g," ");
    const h=t.match(/(\d+)\s*(hint|aiut)/i); const hints=h?+h[1]:0;
    let ok=true, extra=null, away=null; let m;
    if((m=t.match(/(\d+)\s*away/i))){ ok=false; away=+m[1]; }
    else if((m=t.match(/\+\s*(\d+)/))) extra=+m[1];
    else if(/perfect|perfetto/i.test(t)) extra=0;
    else if(/fail|❌|non\s+riuscit|perso/i.test(t)){ ok=false; away=null; }
    else { const ns=numbers(t.replace(/(\d+)\s*(hint|aiut)\w*/gi," ")); if(ns.length) extra=ns[0]; }
    if(ok && extra==null) return null;
    const pen = ok ? extra + hints : 10 + (away||9)/100;
    const show = ok ? (extra===0?"Perfetto":"+"+extra) + (hints?` · ${hints}💡`:"") : "✗ "+(away!=null?away+" away":"non arrivato");
    const st=strip(raw,"Travle");
    const wrong=st.counts["🟥"]||0, nn=st.counts["🟧"]||0;
    return {score:-pen-wrong/100-nn/10000, show, strip:st.str, extra:{ok, extra, hints, away, pen, counts:st.counts, star: ok&&extra===0&&hints===0}};
  }
};

/* ---------- build model ---------- */
function build(){
  const rows=parseCSV(D.csv||"").filter(r=>r.some(c=>c&&c.trim()));
  const header=(rows[0]||[]).map(s=>(s||"").trim());
  const players=header.slice(2).filter(Boolean);
  const days={}; const bad=[]; let cur=null;
  for(const r of rows.slice(1)){
    if(r[0]&&r[0].trim()){ const nd=normDate(r[0]); if(nd) cur=nd; }
    if(!cur) continue;
    const g=GAMES.find(x=>x.toLowerCase()===(r[1]||"").trim().toLowerCase());
    if(!g) continue;
    players.forEach((p,i)=>{
      const raw=(r[2+i]||"").trim(); if(!raw) return;
      const res=PARSE[g](raw);
      days[cur]=days[cur]||{}; days[cur][g]=days[cur][g]||{};
      if(res) days[cur][g][p]=Object.assign({raw},res);
      else bad.push({day:cur,game:g,player:p,raw});
    });
  }
  const dayList=Object.keys(days).filter(d=>GAMES.some(g=>days[d][g]&&Object.keys(days[d][g]).length)).sort();
  const M={players, days, dayList, bad, perDay:{}};
  const S={}; players.forEach(p=>S[p]={points:0,dayWins:0,gameWins:0,podiums:0,played:0,daysPlayed:0,spoons:0,perGame:{},cum:[],winStreak:0,bestWinStreak:0,playStreak:0,bestPlayStreak:0,stars:0,dayPts:[]});
  players.forEach(p=>GAMES.forEach(g=>S[p].perGame[g]={n:0,sum:0,best:null,bestDay:null,wins:0,points:0,scores:[],cats:{},stars:0}));
  let runW={}, runP={};
  for(const d of dayList){
    const pd={games:{}, pts:{}, played:{}, stars:{}, winners:[], spoons:[]};
    players.forEach(p=>{pd.pts[p]=0; pd.played[p]=0; pd.stars[p]=0;});
    for(const g of GAMES){
      const res=(days[d][g])||{};
      const list=players.filter(p=>res[p]).sort((a,b)=>res[b].score-res[a].score);
      const ranks={};
      list.forEach((p,i)=>{ const first=list.findIndex(q=>res[q].score===res[p].score); ranks[p]=first+1; });
      pd.games[g]={res,ranks,order:list};
      list.forEach(p=>{
        const star=!!res[p].extra.star; const pts=(POINTS[ranks[p]-1]||0)+(star?BONUS:0); pd.pts[p]+=pts; pd.played[p]++; if(star) pd.stars[p]++;
        const s=S[p], pg=s.perGame[g]; s.played++; pg.n++; pg.points+=pts;
        const val = g==="Travle"? res[p].extra.pen : res[p].score;
        pg.scores.push(val); pg.sum+=val;
        const better = g==="Travle"? (pg.best==null||val<pg.best) : (pg.best==null||val>pg.best);
        if(better){pg.best=val; pg.bestDay=d; pg.bestShow=res[p].show;}
        if(ranks[p]===1 && list.length>1){ s.gameWins++; pg.wins++; }
        if(ranks[p]<=3 && list.length>1) s.podiums++;
        if(star){ s.stars++; pg.stars++; }
        const cc=res[p].extra.counts||{}; for(const k in cc) pg.cats[k]=(pg.cats[k]||0)+cc[k];
      });
    }
    const active=players.filter(p=>pd.played[p]>0);
    const mx=Math.max(...active.map(p=>pd.pts[p])), mn=Math.min(...active.map(p=>pd.pts[p]));
    pd.winners=active.filter(p=>pd.pts[p]===mx);
    if(active.length>1 && mn<mx) pd.spoons=active.filter(p=>pd.pts[p]===mn);
    players.forEach(p=>{
      const s=S[p]; s.points+=pd.pts[p]; s.cum.push(s.points); s.dayPts.push(pd.played[p]?pd.pts[p]:null);
      if(pd.played[p]){ s.daysPlayed++; runP[p]=(runP[p]||0)+1; } else runP[p]=0;
      s.bestPlayStreak=Math.max(s.bestPlayStreak,runP[p]);
      if(pd.winners.includes(p)&&active.length>1){ s.dayWins++; runW[p]=(runW[p]||0)+1; } else runW[p]=0;
      s.bestWinStreak=Math.max(s.bestWinStreak,runW[p]);
      if(pd.spoons.includes(p)) s.spoons++;
    });
    M.perDay[d]=pd;
  }
  players.forEach(p=>{S[p].winStreak=runW[p]||0; S[p].playStreak=runP[p]||0;});
  M.S=S;
  M.ranking=[...players].sort((a,b)=>S[b].points-S[a].points || S[b].dayWins-S[a].dayWins || S[b].gameWins-S[a].gameWins);
  // h2h
  M.h2h={}; players.forEach(a=>{M.h2h[a]={}; players.forEach(b=>M.h2h[a][b]=0);});
  for(const d of dayList){ const pd=M.perDay[d];
    players.forEach(a=>players.forEach(b=>{ if(a!==b&&pd.played[a]&&pd.played[b]&&pd.pts[a]>pd.pts[b]) M.h2h[a][b]++; })); }
  return M;
}

/* ---------- render ---------- */
let M=null, selDay=null, userPicked=false, tab="oggi", period="tutto";
let selPlayer=null;
const TABS=[["oggi","Giornata"],["classifica","Classifica"],["calendario","Calendario"],["giocatori","Giocatori"],["giochi","Giochi"],["premi","Premi"]];
const color = p => `var(--p${Math.max(0,M.players.indexOf(p))%5})`;
const swatch = p => el("span",{class:"dot",style:`background:${color(p)}`});
function initials(p){ const caps=p.match(/[A-ZÀ-Ý]/g)||[]; return (caps.length>1? caps[0]+caps[1] : p.slice(0,2)).toUpperCase(); }
const avatar = (p,cls="") => el("span",{class:"av "+cls,style:`background:${color(p)}`,"aria-hidden":"true"},initials(p));
const who = p => el("span",{class:"name"},avatar(p),p);
const whoList = ps => ps.length? el("span",{class:"wholist"}, ...ps.map(p=>who(p))) : el("span",{class:"muted"},"—");
const joinIt = a => a.length<2? (a[0]||"") : a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const todayISO = () => new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Rome"});
function dFull(iso){ const dt=dParts(iso); const G=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"]; const MM=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"]; return G[dt.getUTCDay()]+" "+dt.getUTCDate()+" "+MM[dt.getUTCMonth()]; }
function setHash(h){ try{ history.replaceState(null,"","#"+h); }catch(e){} }
function readHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(/^giorno-\d{4}-\d{2}-\d{2}$/.test(h)){ tab="oggi"; selDay=h.slice(7); userPicked=true; }
  else if(/^giocatore-/.test(h)){ tab="giocatori"; selPlayer=h.slice(10); }
  else if(TABS.some(t=>t[0]===h)){ tab=h; if(h==="giocatori") selPlayer=null; }
}
function goTab(t){ tab=t; if(t==="giocatori") selPlayer=null; setHash(t==="oggi"&&userPicked? "giorno-"+selDay : t); render(); window.scrollTo({top:Math.min(window.scrollY, document.getElementById("app").offsetTop-10)}); }
function goDay(d){ selDay=d; userPicked=true; tab="oggi"; setHash("giorno-"+d); render(); }

function render(){
  M=build();
  app.innerHTML="";
  const chips=document.getElementById("chips"); chips.innerHTML="";
  const n=M.dayList.length;
  chips.append(el("span",{class:"chip"},`${M.players.length} sfidanti, ${n||1} ${n===1||!n?"giornata":"giornate"}`));
  if(D.updatedAt){ const u=new Date(D.updatedAt); chips.append(el("span",{class:"chip"+(D.live?" live":"")},(D.live?"Dal vivo, ":"Aggiornata ")+u.toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))); }
  if(!n){
    app.append(el("div",{class:"card empty"}, el("div",{class:"big"},"Si parte!"),
      el("div",null,"Ancora nessun risultato nello sheet. Ognuno incolla nella propria cella il testo “Condividi” del gioco.")));
    if(M.bad.length) app.append(badSection());
    app.append(rulesSection()); foot(); return;
  }
  const today=todayISO();
  if(!userPicked || !M.dayList.includes(selDay)) selDay = M.dayList.includes(today)? today : M.dayList[n-1];
  app.append(tabsBar());
  const views={
    oggi: dayView,
    classifica: ()=>[standingsSection(), trendSection(), h2hSection()],
    calendario: ()=>[el("div",{class:"grid calwrap"}, calendarSection(), weeksSection())],
    giochi: ()=>[gamesSection()],
    giocatori: playersView,
    premi: ()=>[challengeCard(), ...honorsSection(), awardsSection(), M.bad.length? badSection():null, rulesSection()]
  };
  [].concat(views[tab]()).filter(Boolean).forEach(x=>app.append(x));
  foot();
}
function foot(){ document.getElementById("foot").textContent="I risultati arrivano dal vivo dallo sheet “Daily Ne(r)d” e si aggiornano da soli ogni 5 minuti."; }

function tabsBar(){
  return el("nav",{class:"tabs","aria-label":"Sezioni"}, ...TABS.map(([k,l])=>el("button",{class:"tab"+(tab===k?" on":""),"aria-current":tab===k?"page":"false",onclick:()=>goTab(k)},l)));
}

const NS="http://www.w3.org/2000/svg";
function svgEl(t,a){const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;}
function secHead(title,desc){ return el("div",{class:"sec-head"}, el("h2",null,title), desc? el("p",null,desc):null); }

function topoSVG(seed){
  const s=svgEl("svg",{class:"topo",viewBox:"0 0 1000 420",preserveAspectRatio:"xMidYMid slice","aria-hidden":"true"});
  const centers=[[820,120,11],[180,380,9],[520,-40,7]];
  centers.forEach(([cx,cy,n],ci)=>{
    for(let k=1;k<=n;k++){
      const r=k*34; let d="";
      for(let i=0;i<=72;i++){
        const a=i/72*Math.PI*2;
        const rr=r*(1+0.16*Math.sin(3*a+seed+ci)+0.08*Math.sin(5*a+k*0.4+ci*2)+0.05*Math.cos(7*a+seed));
        d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*0.8*Math.sin(a)).toFixed(1);
      }
      s.append(svgEl("path",{d:d+"Z",fill:"none",stroke:"var(--contour)","stroke-width":k%4===0?2:1.2}));
    }
  });
  return s;
}

function podiumSVG(pd){
  const order=[...M.players].filter(p=>pd.played[p]).sort((a,b)=>pd.pts[b]-pd.pts[a]);
  const groups=[]; order.forEach(p=>{ const g=groups.find(g=>pd.pts[g[0]]===pd.pts[p]); g? g.push(p) : groups.push([p]); });
  const slots=[{i:1,x:150,h:150},{i:0,x:290,h:225},{i:2,x:425,h:110}];
  const W=560,H=340,base=H-6;
  const s=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Podio: "+groups.slice(0,3).map(g=>g.join(" e ")+" "+pd.pts[g[0]]+" punti").join(", ")});
  s.append(svgEl("path",{d:`M0,${base} L60,${base-70} L110,${base-40} L200,${base-95} L260,${base-60} L360,${base-120} L470,${base-55} L520,${base-80} L${W},${base-30} L${W},${base} Z`,fill:"#ffffff",opacity:".06"}));
  const draw=sl=>{
    const g=groups[sl.i]; const x=sl.x,h=sl.h,w=h*1.25+60;
    const col=g?`var(--p${M.players.indexOf(g[0])%5})`:"var(--muted)";
    const pk=[x,base-h], L=[x-w/2,base], R=[x+w/2,base], sh1=[x-w*0.2,base-h*0.6], sh2=[x+w*0.24,base-h*0.52];
    s.append(svgEl("path",{d:`M${L} L${sh1} L${pk} L${sh2} L${R} Z`,fill:col,stroke:"var(--sea)","stroke-width":3,"stroke-linejoin":"round",opacity:g?1:.3}));
    if(g&&g.length>1){ g.slice(1,3).forEach((p,k)=>{ s.append(svgEl("path",{d:`M${x-w*(0.34-k*0.08)},${base} L${x-w*(0.12-k*0.06)},${base-h*0.45} L${x+w*0.02},${base} Z`,fill:`var(--p${M.players.indexOf(p)%5})`,opacity:.95})); }); }
    s.append(svgEl("path",{d:`M${pk} L${sh2} L${R} L${x+w*0.05},${base} Z`,fill:"#000",opacity:".12"}));
    const sy=base-h*0.74;
    s.append(svgEl("path",{d:`M${pk} L${x+h*0.21},${sy} L${x+h*0.1},${sy-6} L${x},${sy+8} L${x-h*0.08},${sy-4} L${x-h*0.17},${sy+4} Z`,fill:"var(--snow)"}));

function headlines(d){

    if(t && !t.extra.ok) out.push(["🧳",`${p} non arriva a destinazione a Travle`]);

function weekIndex(ws){ return Math.round((dParts(ws)-dParts(CH_EPOCH))/(7*864e5)); }
function challengeFor(ws){
  const i=Math.max(0,weekIndex(ws)), c=CHALLENGES[i%CHALLENGES.length], level=Math.floor(i/CHALLENGES.length)+1;
  let target=c.base+c.step*(level-1); if(c.max) target=Math.min(target,c.max);

}
function challengeResult(ws){
  const ch=challengeFor(ws), days=M.dayList.filter(d=>weekStart(d)===ws), val={};
  M.players.forEach(p=>{ const v=days.map(d=>ch.f(M.perDay[d],p)); val[p]= v.length? (ch.agg==="max"? Math.max(...v) : v.reduce((a,b)=>a+b,0)) : 0; });
  const rank=[...M.players].sort((a,b)=>val[b]-val[a]);
  const best=val[rank[0]]; const winners= best>0? rank.filter(p=>val[p]===best) : [];
  return {ch, days, val, rank, winners, done: ws<weekStart(todayISO())};
}
function allChallenges(){ const ws=[...new Set(M.dayList.map(weekStart))].sort(); return ws.map(challengeResult); }

function drawTrend(box,tip){
  const W=Math.max(300,box.clientWidth), H=Math.min(320,Math.max(220,W*0.42));
  const m={l:36,r:14,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=M.dayList.length;
  const max=Math.max(5,...M.players.map(p=>M.S[p].points));
  const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const x=i=> m.l + (n<=1? iw/2 : i*iw/(n-1)), y=v=> m.t + ih - v/top*ih;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label","Punti accumulati per giocatore");
  const mk=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  for(let v=0;v<=top;v+=step){ svg.append(mk("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1}));
    const t=mk("text",{x:m.l-8,y:y(v)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"}); t.textContent=v; svg.append(t); }
  const every=Math.max(1,Math.ceil(n/ Math.max(2,Math.floor(iw/60))));
  M.dayList.forEach((d,i)=>{ if(i%every && i!==n-1) return; const t=mk("text",{x:x(i),y:H-6,"text-anchor":"middle","font-size":11,fill:"var(--muted)"}); t.textContent=dShort(d); svg.append(t); });
  M.players.forEach(p=>{
    const c=M.S[p].cum; const path=c.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(n>1) svg.append(mk("path",{d:path,fill:"none",stroke:color(p),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    svg.append(mk("circle",{cx:x(n-1),cy:y(c[n-1]),r:4.5,fill:color(p),stroke:"var(--surface)","stroke-width":2}));
  });
  const cross=mk("line",{y1:m.t,y2:m.t+ih,stroke:"var(--muted)","stroke-width":1,"stroke-dasharray":"3 3",visibility:"hidden"}); svg.append(cross);
  const hit=mk("rect",{x:m.l-10,y:0,width:iw+20,height:H,fill:"transparent"}); svg.append(hit);
  const show=ev=>{
    const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width;
    const i=n<=1?0:Math.max(0,Math.min(n-1,Math.round((px-m.l)/(iw/(n-1)))));
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("visibility","visible");
    tip.innerHTML=""; tip.append(el("div",{class:"t"},`Giorno ${i+1} · ${dLong(M.dayList[i])}`));
    [...M.players].sort((a,b)=>M.S[b].cum[i]-M.S[a].cum[i]).forEach(p=>tip.append(el("div",{class:"r"},el("span",null,swatch(p),p),el("b",null,M.S[p].cum[i]))));
    tip.style.display="block";
    const bx=box.clientWidth, left=x(i)*r.width/W; const tw=tip.offsetWidth;
    tip.style.left=Math.min(bx-tw, Math.max(0, left+12 > bx-tw ? left-tw-12 : left+12))+"px"; tip.style.top="8px";
  };
  hit.addEventListener("pointermove",show); hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",()=>{tip.style.display="none"; cross.setAttribute("visibility","hidden");});
  box.querySelector("svg")?.remove(); box.prepend(svg);
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

      el("li",null,"Per ogni gioco e ogni giorno si fa una classifica: 5 punti al primo, 3 al secondo, 2 al terzo, 1 al quarto (e 0 al quinto, se un giorno tornate in cinque). A pari merito, stessi punti."),

      el("li",null,"La giornata la vince chi somma più punti sui tre giochi (massimo 18, stelle comprese). Ultimo = cucchiaio di legno 🥄."),
      el("li",null,"⭐ Partita perfetta, +1 punto: Farhike con tutti e 5 i paesi trovati (nessun ⬛), City Angle con 3 città al primo tentativo (🟩🟩🟩), Travle con +0."),
      el("li",null,"A parità di punteggio decidono i quadratini: a Farhike vince chi ha trovato paesi più rari, a City Angle chi ha usato meno tentativi, a Travle chi ha fatto meno 🟥 e meno 🟧."),
      el("li",null,"Chi non gioca prende 0 per quel gioco."))));
}

readHash();
render();
function loadLive(){
  if(!SHEET_CSV_URL) return;
  fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t=>{ if(/^\s*"?Giorno"?,/i.test(t) && (t!==D.csv || !D.live)){ D.csv=t; D.updatedAt=new Date().toISOString(); D.live=true; render(); } else if(D.live){ D.updatedAt=new Date().toISOString(); } })
    .catch(()=>{});
}
loadLive();
setInterval(loadLive, 5*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadLive(); });
addEventListener("hashchange",()=>{ readHash(); render(); });
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{const b=document.getElementById("trendchart"); if(b) drawTrend(b,b.querySelector(".tip"));},150);});
})();
</script>
