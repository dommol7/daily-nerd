<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Ne(r)d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#e3ece4; --surface:#f7faf6; --surface-2:#e9f1ea; --sea:#cfe2e8; --border:rgba(20,48,74,.14);
  --text:#14304a; --text-2:#46607a; --muted:#7a8f9f;
  --route:#d4412f; --gold:#c98a00; --sun:#f2b630; --contour:rgba(20,48,74,.11);
  --p0:#2a78d6; --p1:#eb6834; --p2:#1baf7a; --p3:#eda100; --p4:#e87ba4;
  --grid:rgba(20,48,74,.1); --snow:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0e1f2e; --surface:#142a3d; --surface-2:#1a3349; --sea:#173a52; --border:rgba(234,241,244,.12);
    --text:#eaf1f4; --text-2:#b4c4cf; --muted:#7f95a5;
    --route:#ff6b57; --gold:#f5c04a; --sun:#f5c04a; --contour:rgba(234,241,244,.07);
    --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181;
    --grid:rgba(234,241,244,.08); --snow:#e8eff3;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1f2e; --surface:#142a3d; --surface-2:#1a3349; --sea:#173a52; --border:rgba(234,241,244,.12);
  --text:#eaf1f4; --text-2:#b4c4cf; --muted:#7f95a5;
  --route:#ff6b57; --gold:#f5c04a; --sun:#f5c04a; --contour:rgba(234,241,244,.07);
  --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181;
  --grid:rgba(234,241,244,.08); --snow:#e8eff3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:26px 18px 64px}
.disp,h1,h2,.big,.hero-name,.rank,.score,.dlabel{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;letter-spacing:.005em}
h1{font-size:clamp(52px,11vw,104px);line-height:.85;margin:0}
h1 .paren{color:var(--route)}
h2{font-size:clamp(30px,5vw,40px);line-height:1;margin:0}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
.sub{color:var(--text-2);margin:10px 0 0;max-width:46ch}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-2)}
button.chip{cursor:pointer;font:inherit;font-size:13px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gday{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
@media (max-width:760px){.gday{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:0;color:var(--text-2);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.name{font-weight:600;white-space:nowrap}
:focus-visible{outline:2px solid var(--route);outline-offset:2px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--sea);margin-top:0;padding:26px 26px 0}
.hero > svg.topo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px 24px;align-items:end}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr}}
.hero-text{padding-bottom:26px}
.hero .kicker{margin:0;color:var(--text-2);font-weight:600}
.hero-title{margin:6px 0 0;font:600 18px Figtree,sans-serif;color:var(--text-2)}
.hero-name{font-size:clamp(56px,10vw,92px);line-height:.9;margin:4px 0 0}
.hero-note{margin:8px 0 0;font-size:16px}
.markers{display:grid;gap:10px;margin-top:22px}
.marker{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 14px;border:1px solid var(--border)}
.marker .ico{font-size:22px;width:28px;text-align:center}
.marker .lbl{font-size:13px;color:var(--text-2)}
.marker .val{font-weight:600}
.podium svg{display:block;width:100%;height:auto}

/* leaderboard */
.board{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 18px;border-top:1px solid var(--border)}
.row:first-child{border-top:none}
.row.first{background:linear-gradient(90deg,color-mix(in oklab,var(--sun) 22%,transparent),transparent 70%)}
.rank{font-size:44px;line-height:1;color:var(--muted);text-align:center}
.row.first .rank{color:var(--gold)}
.who-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who-line .name{font-size:18px}
.stats{font-size:13px;color:var(--text-2);margin-top:2px}
.track{height:8px;background:var(--surface-2);border-radius:4px;margin-top:8px;overflow:hidden}
.track > i{display:block;height:100%;border-radius:0 4px 4px 0}
.score{font-size:46px;line-height:1;text-align:right}
.score small{display:block;font:500 12px Figtree,sans-serif;color:var(--muted);text-align:right}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:13px;color:var(--text-2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-variant-numeric:tabular-nums}
.pill.p5{background:var(--sun);color:#14304a}
.strip{font-size:15px;letter-spacing:2px;line-height:1.3;margin-top:4px;white-space:nowrap}
.pill.star{background:color-mix(in oklab,var(--sun) 40%,var(--surface));color:var(--text)}
.dist{display:flex;gap:2px;height:12px;flex:1;min-width:90px;max-width:170px}
.dist i{display:block;height:100%}
.dist i:first-child{border-radius:4px 0 0 4px}.dist i:last-child{border-radius:0 4px 4px 0}
.legend-mini{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text-2);margin:2px 0 8px}
.legend-mini span{display:inline-flex;align-items:center;gap:4px}
.legend-mini b{display:inline-block;width:10px;height:10px;border-radius:3px}
.raw{font-variant-numeric:tabular-nums;font-weight:500}
.absent{color:var(--muted);font-style:italic}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.daynav button,.btn{font:inherit;font-weight:600;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 14px;cursor:pointer}
.btn.primary{background:var(--route);color:#fff;border-color:transparent}
.daynav button:disabled{opacity:.35;cursor:default}
.daynav .dlabel{font-size:26px;min-width:190px}
.ticket{background:var(--surface);border:1px dashed color-mix(in oklab,var(--text) 35%,transparent);border-radius:14px;padding:18px;position:relative}
.share{white-space:pre-wrap;font:14px/1.55 Figtree,sans-serif;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:10px 0 12px}
.cal{display:flex;flex-wrap:wrap;gap:8px}
.cal button{font:600 12px Figtree,sans-serif;width:46px;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.cal button .d{font-size:11px;color:var(--muted);font-weight:500}
.cal button.sel{border:2px solid var(--route)}
.cal button .w{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 8px 24px rgba(20,48,74,.18);min-width:150px;display:none;z-index:5}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-2);margin-bottom:10px}
.game-card{border-top:5px solid var(--route)}
.game-card h3{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:28px;font-weight:800;margin:0 0 6px}
.record{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.record .big{font-size:30px;line-height:1}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);gap:10px;font-size:14px}
.stat-row:last-child{border-bottom:none}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.badge{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.badge .ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--sea);display:flex;align-items:center;justify-content:center;font-size:24px}
.badge .t{font-weight:700}
.badge .who{margin-top:2px}
.badge .why{font-size:13px;color:var(--text-2);margin-top:2px}
.h2h td,.h2h th{text-align:center;font-variant-numeric:tabular-nums}
.h2h td.self{color:var(--muted)}
.h2h td.win{font-weight:800;color:var(--route)}
.empty{padding:34px;text-align:center;color:var(--text-2)}
.empty .big{font-size:44px;color:var(--text);margin-bottom:6px}
.warn{border-left:5px solid var(--sun)}
.warn li{margin:4px 0}
.warn code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.rules li{margin:6px 0;color:var(--text-2)}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media (max-width:520px){.rank{font-size:34px}.score{font-size:36px}.row{grid-template-columns:40px minmax(0,1fr) auto;padding:12px 14px}.hero{padding:20px 18px 0}}

/* v3: tabs, avatar, tiles, calendario */
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:6px;margin:0 0 22px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;font:600 15px Figtree,sans-serif;color:var(--text-2);background:transparent;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface)}
.tab.on{background:var(--text);color:var(--bg)}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font:800 11px Figtree,sans-serif;letter-spacing:.02em;margin-right:8px;flex:none;box-shadow:0 0 0 2px var(--surface)}
.av.sm{width:20px;height:20px;font-size:9px;margin-right:0}
.name{display:inline-flex;align-items:center}
.wholist{display:inline-flex;flex-wrap:wrap;gap:4px 12px}
.legend .av.sm{margin-right:6px}
.tiles{display:flex;gap:3px;margin-top:6px}
.tiles i{display:block;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.daynav{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.navbtn{font:700 18px Figtree,sans-serif;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.navbtn:disabled{opacity:.3;cursor:default}
.dlabel{display:flex;flex-direction:column;min-width:190px}
.dnum{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;font-size:30px;line-height:1}
.ddate{color:var(--text-2);font-size:14px;margin-top:2px}
.daynav-side{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.missing{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:color-mix(in oklab,var(--sun) 22%,var(--surface));border:1px solid color-mix(in oklab,var(--sun) 50%,transparent);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.missing.done{background:color-mix(in oklab,#3aa757 18%,var(--surface));border-color:color-mix(in oklab,#3aa757 45%,transparent);font-weight:600}
.missing-t{font-weight:700}
.missing-list{display:flex;flex-wrap:wrap;gap:8px 16px}
.miss-item{display:inline-flex;align-items:center;gap:6px}
.news h3,.ticket h3{margin-bottom:10px}
.headlines{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.headlines li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.35}
.headlines .hi{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:16px}
.gday{margin-top:14px;align-items:start}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.seg button{font:600 13px Figtree,sans-serif;border:0;background:transparent;color:var(--text-2);padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--route);color:#fff}
.months{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.month h3{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-size:26px;font-weight:800;margin-bottom:10px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cal-c{aspect-ratio:1/1.05;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px;font:600 12px Figtree,sans-serif;color:var(--muted);border:1px solid transparent}
.cal-c.empty{background:transparent}
.cal-c.future{opacity:.45}
.cal-c.has{background:var(--surface);border-color:var(--border);color:var(--text);cursor:pointer}
.cal-c.has:hover{border-color:var(--route)}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--route)}
.cal-c.sel{background:color-mix(in oklab,var(--sun) 25%,var(--surface))}
.cal-c .n{align-self:flex-start;padding-left:4px}
.cal-w{display:flex;gap:0}
.cal-w .av.sm:nth-child(2){margin-left:-6px}
.cal-s{font-size:8px;line-height:1}
.wk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.wk:last-child{border-bottom:0}
.wk-d{font-weight:700}
.wk-w{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fbf71;margin-right:6px;box-shadow:0 0 0 3px color-mix(in oklab,#2fbf71 25%,transparent);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.chip.live::before{animation:none}}
.daytable td{padding:12px 8px}
section:first-of-type{margin-top:0}
@media (max-width:520px){.tab{padding:9px 12px;font-size:14px}.daynav-side{margin-left:0;width:100%}.tiles i{width:14px;height:14px}.cal-c{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Ne<span class="paren">(</span>r<span class="paren">)</span>d</h1>
      <p class="sub">Farhike, City Angle e Travle: ogni giorno una nuova mappa da conquistare.</p>
    </div>
    <div class="chips"><span class="chips" id="chips"></span><button class="chip" id="themeBtn" title="Tema chiaro/scuro" >◐ Tema</button></div>
  </header>

  <div id="app"></div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGE_FnnI2V_FOY55s4-fTdM9xESB0zevdxlIjtZxYKOOXjcHdZkYMTLTuI9nVF3l9GATOPGHWNPnHE/pub?gid=1155406161&single=true&output=csv"; // link "Pubblica sul web" dello sheet, formato CSV
const D = Object.assign({csv:"", updatedAt:null, live:false}, window.DAILY_NERD||{});
const GAMES = ["Farhike","City Angle","Travle"];
const GAME_ICON = {"Farhike":"🏔️","City Angle":"🧭","Travle":"🗺️"};
const POINTS = [5,3,2,1,0];
const BONUS = 1; // punto extra per una partita perfetta
const CATS = {
  "Farhike":   [["⬛","Mancato","#2e3338",0],["⬜","Comune","#b4bac0",1],["🟩","Non comune","#3aa757",2],["🟦","Raro","#2f6fd6",3],["🟪","Sfuggente","#8b4fd1",4],["🟧","Pioniere","#ef8a1f",5]],
  "City Angle":[["🟩","Al primo tentativo","#3aa757"],["🟨","Al secondo","#f2c230"],["🟧","Al terzo","#ef8a1f"],["🟥","Al quarto","#d9402f"],["🟪","Al quinto o oltre","#8b4fd1"],["⬛","Non trovata","#2e3338"]],
  "Travle":    [["✅","Perfetto","#12a150"],["🟩","Giusto","#8fd17e"],["🟧","Non necessario","#ef8a1f"],["🟥","Sbagliato","#d9402f"]]
};
const STAR_RULE = {"Farhike":"tutti e 5 i paesi trovati, nessun ⬛","City Angle":"3 città al primo tentativo, 🟩🟩🟩","Travle":"percorso perfetto, +0"};
function strip(raw, g){
  const set=CATS[g].map(c=>c[0]);
  const t=raw.replace(/◻️|◻|🔲|🔳|▫️|⬜️/g,"⬜").replace(/✅️/g,"✅");
  const arr=Array.from(t).filter(ch=>set.includes(ch));
  const counts={}; arr.forEach(ch=>counts[ch]=(counts[ch]||0)+1);
  return {arr, str:arr.join(""), counts};
}
const app = document.getElementById("app");

/* ---------- theme ---------- */
try{const t=localStorage.getItem("nerd-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx;
  try{localStorage.setItem("nerd-theme",nx);}catch(e){}
  render();
};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="style") n.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
  return n;
}
const fmt = (n,d=0)=> Number(n).toLocaleString("it-IT",{maximumFractionDigits:d,minimumFractionDigits:0});
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function dParts(iso){const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d));}
function dLong(iso){const dt=dParts(iso); return GIORNI[dt.getUTCDay()]+" "+dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}
function dShort(iso){const dt=dParts(iso); return dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function normDate(s){
  s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return null;
}
function numbers(t){ return [...t.matchAll(/\d+(?:[.,]\d+)?/g)].map(x=>parseFloat(x[0].replace(",","."))); }

/* ---------- parsers: each returns {score (higher is better), show, extra:{}} or null ---------- */
const PARSE = {
  "Farhike"(raw){
    const t=raw.replace(/https?:\/\/\S+|\S+\.(com|earth)\S*/gi," ").replace(/#\s*\d+/g," ");
    let v=null, m=t.match(/(\d+(?:[.,]\d+)?)\s*\/\s*500/);
    if(m) v=parseFloat(m[1].replace(",","."));
    if(v==null){ const km=[...t.matchAll(/(\d{1,3}(?:[.,]\d+)?)\s*km/gi)].map(x=>parseFloat(x[1].replace(",","."))).filter(n=>n<500); if(km.length) v=Math.max(...km); }
    if(v==null){ const ns=numbers(t).filter(n=>n<=500); if(ns.length) v=Math.max(...ns); }
    if(v==null) return null;
    const st=strip(raw,"Farhike");
    const w=Object.fromEntries(CATS.Farhike.map(c=>[c[0],c[3]]));
    const rarity=st.arr.reduce((a,ch)=>a+w[ch],0);
    const star = st.arr.length>=5 && !st.counts["⬛"];
    return {score:v+rarity/1000, show:fmt(v,1)+" km", strip:st.str, extra:{km:v, counts:st.counts, rarity, star}};
  },
  "City Angle"(raw){
    const t=raw.replace(/https?:\/\/\S+/gi," ");
    let v=null; const m=t.match(/(\d[\d.,\s]*)\s*pts?\b/i);
    if(m) v=parseInt(m[1].replace(/\D/g,""),10);
    const sv=t.match(/solved\s+(?:all\s+)?(\d)/i), gs=t.match(/(\d+)\s+guess/i);
    const ft=t.match(/(\d)\s*\/\s*5\s*first/i);
    if(v==null){ const ns=numbers(t.replace(/\d\s*\/\s*5/g," ")); if(ns.length) v=Math.max(...ns); }
    if(v==null||isNaN(v)) return null;
    const solved=sv?+sv[1]:null, guesses=gs?+gs[1]:null;
    const sub = guesses!=null? `${solved??"?"}/3 città in ${guesses} tentativi` : (ft? `${ft[1]}/5 al primo colpo`:"");
    const st=strip(raw,"City Angle");
    const star = (st.arr.length===3 && st.arr.every(c=>c==="🟩")) || (guesses===3&&solved===3);
    return {score:v+(guesses!=null?(50-guesses)/1000:0), show:fmt(v)+" pts", sub, strip:st.str, extra:{pts:v, solved, guesses, counts:st.counts, star}};
  },
  "Travle"(raw){
    const t=raw.replace(/https?:\/\/\S+/gi," ").replace(/#travle\w*/gi," ").replace(/#\s*\d+/g," ");
    const h=t.match(/(\d+)\s*(hint|aiut)/i); const hints=h?+h[1]:0;
    let ok=true, extra=null, away=null; let m;
    if((m=t.match(/(\d+)\s*away/i))){ ok=false; away=+m[1]; }
    else if((m=t.match(/\+\s*(\d+)/))) extra=+m[1];
    else if(/perfect|perfetto/i.test(t)) extra=0;
    else if(/fail|❌|non\s+riuscit|perso/i.test(t)){ ok=false; away=null; }
    else { const ns=numbers(t.replace(/(\d+)\s*(hint|aiut)\w*/gi," ")); if(ns.length) extra=ns[0]; }
    if(ok && extra==null) return null;
    const pen = ok ? extra + hints : 10 + (away||9)/100;
    const show = ok ? (extra===0?"Perfetto":"+"+extra) + (hints?` · ${hints}💡`:"") : "✗ "+(away!=null?away+" away":"non arrivato");
    const st=strip(raw,"Travle");
    const wrong=st.counts["🟥"]||0, nn=st.counts["🟧"]||0;
    return {score:-pen-wrong/100-nn/10000, show, strip:st.str, extra:{ok, extra, hints, away, pen, counts:st.counts, star: ok&&extra===0&&hints===0}};
  }
};

/* ---------- build model ---------- */
function build(){
  const rows=parseCSV(D.csv||"").filter(r=>r.some(c=>c&&c.trim()));
  const header=(rows[0]||[]).map(s=>(s||"").trim());
  const players=header.slice(2).filter(Boolean);
  const days={}; const bad=[]; let cur=null;
  for(const r of rows.slice(1)){
    if(r[0]&&r[0].trim()){ const nd=normDate(r[0]); if(nd) cur=nd; }
    if(!cur) continue;
    const g=GAMES.find(x=>x.toLowerCase()===(r[1]||"").trim().toLowerCase());
    if(!g) continue;
    players.forEach((p,i)=>{
      const raw=(r[2+i]||"").trim(); if(!raw) return;
      const res=PARSE[g](raw);
      days[cur]=days[cur]||{}; days[cur][g]=days[cur][g]||{};
      if(res) days[cur][g][p]=Object.assign({raw},res);
      else bad.push({day:cur,game:g,player:p,raw});
    });
  }
  const dayList=Object.keys(days).filter(d=>GAMES.some(g=>days[d][g]&&Object.keys(days[d][g]).length)).sort();
  const M={players, days, dayList, bad, perDay:{}};
  const S={}; players.forEach(p=>S[p]={points:0,dayWins:0,gameWins:0,podiums:0,played:0,daysPlayed:0,spoons:0,perGame:{},cum:[],winStreak:0,bestWinStreak:0,playStreak:0,bestPlayStreak:0,stars:0,dayPts:[]});
  players.forEach(p=>GAMES.forEach(g=>S[p].perGame[g]={n:0,sum:0,best:null,bestDay:null,wins:0,points:0,scores:[],cats:{},stars:0}));
  let runW={}, runP={};
  for(const d of dayList){
    const pd={games:{}, pts:{}, played:{}, stars:{}, winners:[], spoons:[]};
    players.forEach(p=>{pd.pts[p]=0; pd.played[p]=0; pd.stars[p]=0;});
    for(const g of GAMES){
      const res=(days[d][g])||{};
      const list=players.filter(p=>res[p]).sort((a,b)=>res[b].score-res[a].score);
      const ranks={};
      list.forEach((p,i)=>{ const first=list.findIndex(q=>res[q].score===res[p].score); ranks[p]=first+1; });
      pd.games[g]={res,ranks,order:list};
      list.forEach(p=>{
        const star=!!res[p].extra.star; const pts=(POINTS[ranks[p]-1]||0)+(star?BONUS:0); pd.pts[p]+=pts; pd.played[p]++; if(star) pd.stars[p]++;
        const s=S[p], pg=s.perGame[g]; s.played++; pg.n++; pg.points+=pts;
        const val = g==="Travle"? res[p].extra.pen : res[p].score;
        pg.scores.push(val); pg.sum+=val;
        const better = g==="Travle"? (pg.best==null||val<pg.best) : (pg.best==null||val>pg.best);
        if(better){pg.best=val; pg.bestDay=d; pg.bestShow=res[p].show;}
        if(ranks[p]===1 && list.length>1){ s.gameWins++; pg.wins++; }
        if(ranks[p]<=3 && list.length>1) s.podiums++;
        if(star){ s.stars++; pg.stars++; }
        const cc=res[p].extra.counts||{}; for(const k in cc) pg.cats[k]=(pg.cats[k]||0)+cc[k];
      });
    }
    const active=players.filter(p=>pd.played[p]>0);
    const mx=Math.max(...active.map(p=>pd.pts[p])), mn=Math.min(...active.map(p=>pd.pts[p]));
    pd.winners=active.filter(p=>pd.pts[p]===mx);
    if(active.length>1 && mn<mx) pd.spoons=active.filter(p=>pd.pts[p]===mn);
    players.forEach(p=>{
      const s=S[p]; s.points+=pd.pts[p]; s.cum.push(s.points); s.dayPts.push(pd.played[p]?pd.pts[p]:null);
      if(pd.played[p]){ s.daysPlayed++; runP[p]=(runP[p]||0)+1; } else runP[p]=0;
      s.bestPlayStreak=Math.max(s.bestPlayStreak,runP[p]);
      if(pd.winners.includes(p)&&active.length>1){ s.dayWins++; runW[p]=(runW[p]||0)+1; } else runW[p]=0;
      s.bestWinStreak=Math.max(s.bestWinStreak,runW[p]);
      if(pd.spoons.includes(p)) s.spoons++;
    });
    M.perDay[d]=pd;
  }
  players.forEach(p=>{S[p].winStreak=runW[p]||0; S[p].playStreak=runP[p]||0;});
  M.S=S;
  M.ranking=[...players].sort((a,b)=>S[b].points-S[a].points || S[b].dayWins-S[a].dayWins || S[b].gameWins-S[a].gameWins);
  // h2h
  M.h2h={}; players.forEach(a=>{M.h2h[a]={}; players.forEach(b=>M.h2h[a][b]=0);});
  for(const d of dayList){ const pd=M.perDay[d];
    players.forEach(a=>players.forEach(b=>{ if(a!==b&&pd.played[a]&&pd.played[b]&&pd.pts[a]>pd.pts[b]) M.h2h[a][b]++; })); }
  return M;
}

function topoSVG(seed){
  const s=svgEl("svg",{class:"topo",viewBox:"0 0 1000 420",preserveAspectRatio:"xMidYMid slice","aria-hidden":"true"});
  const centers=[[820,120,11],[180,380,9],[520,-40,7]];
  centers.forEach(([cx,cy,n],ci)=>{
    for(let k=1;k<=n;k++){
      const r=k*34; let d="";
      for(let i=0;i<=72;i++){
        const a=i/72*Math.PI*2;
        const rr=r*(1+0.16*Math.sin(3*a+seed+ci)+0.08*Math.sin(5*a+k*0.4+ci*2)+0.05*Math.cos(7*a+seed));
        d+=(i?"L":"M")+(cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*0.8*Math.sin(a)).toFixed(1);
      }
      s.append(svgEl("path",{d:d+"Z",fill:"none",stroke:"var(--contour)","stroke-width":k%4===0?2:1.2}));
    }
  });
  return s;
}

    s.append(svgEl("path",{d:`M${pk} L${sh2} L${R} L${x+w*0.05},${base} Z`,fill:"#000",opacity:".12"}));
    const sy=base-h*0.74;

  const pd=M.perDay[d], out=[];
  const order=M.players.filter(p=>pd.played[p]).sort((a,b)=>pd.pts[b]-pd.pts[a]);
  if(order.length>1){ const gap=pd.pts[order[0]]-pd.pts[order[1]];
    if(gap===0) out.push(["🤝",`Pari merito in vetta: ${pd.winners.join(" e ")} a ${pd.pts[order[0]]} punti`]);
    else if(gap===1) out.push(["🏁",`Volata finale: ${order[0]} batte ${order[1]} di un solo punto`]);
    else if(gap>=5) out.push(["🚀",`${order[0]} fa il vuoto: ${gap} punti su ${order[1]}`]); }
  GAMES.forEach(g=>{
    const G=pd.games[g]; if(!G.order.length) return;
    const stars=G.order.filter(p=>G.res[p].extra.star);
    if(stars.length) out.push(["⭐",`${stars.join(" e ")} ${stars.length>1?"perfetti":"perfetto"} a ${g}`]);
    const top=G.order.filter(p=>G.ranks[p]===1);
    if(top.length===1 && G.order.length>1){ const sec=G.order.find(p=>G.ranks[p]>1);
      const a=G.res[top[0]], b=G.res[sec];
      if(g==="Farhike" && a.extra.km-b.extra.km>=40) out.push([GAME_ICON[g],`${top[0]} domina Farhike: ${fmt(a.extra.km)} km, ${fmt(a.extra.km-b.extra.km)} più di ${sec}`]);
      if(g==="City Angle" && a.extra.pts-b.extra.pts>=700) out.push([GAME_ICON[g],`${top[0]} stacca tutti a City Angle con ${fmt(a.extra.pts)} pts`]); }
  });
  M.players.forEach(p=>{
    const f=pd.games["Farhike"].res[p], c=pd.games["City Angle"].res[p], t=pd.games["Travle"].res[p];
    if(f){ const k=f.extra.counts||{}; if(k["🟧"]) out.push(["🟧",`${p} scova un paese trailblazer a Farhike`]); else if(k["🟪"]>=1&&!f.extra.star) out.push(["🟪",`${p} trova un paese sfuggente a Farhike`]); if((k["⬛"]||0)>=4) out.push(["🕳️",`${p} si perde: ${k["⬛"]} paesi mancati a Farhike`]); }
    if(c && (c.extra.counts||{})["⬛"]) out.push(["🏙️",`${p} non trova una città a City Angle`]);
    if(t && ((t.extra.counts||{})["🟥"]||0)>=2) out.push(["🚧",`${p} sbaglia strada ${(t.extra.counts||{})["🟥"]} volte a Travle`]);
    if(t && !t.extra.ok) out.push(["🧳",`${p} non arriva a destinazione a Travle`]);
  });
  const seen=new Set(); return out.filter(([i,tx])=>!seen.has(tx)&&seen.add(tx)).slice(0,6);
}

function drawTrend(box,tip){
  const W=Math.max(300,box.clientWidth), H=Math.min(320,Math.max(220,W*0.42));
  const m={l:36,r:14,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=M.dayList.length;
  const max=Math.max(5,...M.players.map(p=>M.S[p].points));
  const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const x=i=> m.l + (n<=1? iw/2 : i*iw/(n-1)), y=v=> m.t + ih - v/top*ih;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label","Punti accumulati per giocatore");
  const mk=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  for(let v=0;v<=top;v+=step){ svg.append(mk("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1}));
    const t=mk("text",{x:m.l-8,y:y(v)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"}); t.textContent=v; svg.append(t); }
  const every=Math.max(1,Math.ceil(n/ Math.max(2,Math.floor(iw/60))));
  M.dayList.forEach((d,i)=>{ if(i%every && i!==n-1) return; const t=mk("text",{x:x(i),y:H-6,"text-anchor":"middle","font-size":11,fill:"var(--muted)"}); t.textContent=dShort(d); svg.append(t); });
  M.players.forEach(p=>{
    const c=M.S[p].cum; const path=c.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(n>1) svg.append(mk("path",{d:path,fill:"none",stroke:color(p),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    svg.append(mk("circle",{cx:x(n-1),cy:y(c[n-1]),r:4.5,fill:color(p),stroke:"var(--surface)","stroke-width":2}));
  });
  const cross=mk("line",{y1:m.t,y2:m.t+ih,stroke:"var(--muted)","stroke-width":1,"stroke-dasharray":"3 3",visibility:"hidden"}); svg.append(cross);
  const hit=mk("rect",{x:m.l-10,y:0,width:iw+20,height:H,fill:"transparent"}); svg.append(hit);
  const show=ev=>{
    const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width;
    const i=n<=1?0:Math.max(0,Math.min(n-1,Math.round((px-m.l)/(iw/(n-1)))));
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("visibility","visible");
    tip.innerHTML=""; tip.append(el("div",{class:"t"},`Giorno ${i+1} · ${dLong(M.dayList[i])}`));
    [...M.players].sort((a,b)=>M.S[b].cum[i]-M.S[a].cum[i]).forEach(p=>tip.append(el("div",{class:"r"},el("span",null,swatch(p),p),el("b",null,M.S[p].cum[i]))));
    tip.style.display="block";
    const bx=box.clientWidth, left=x(i)*r.width/W; const tw=tip.offsetWidth;
    tip.style.left=Math.min(bx-tw, Math.max(0, left+12 > bx-tw ? left-tw-12 : left+12))+"px"; tip.style.top="8px";
  };
  hit.addEventListener("pointermove",show); hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",()=>{tip.style.display="none"; cross.setAttribute("visibility","hidden");});
  box.querySelector("svg")?.remove(); box.prepend(svg);
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

  const tb=el("tbody");
  P.forEach(a=>{ tb.append(el("tr",null, el("th",{style:"text-align:left"},who(a)),
    ...P.map(b=> a===b? el("td",{class:"self"},"·") : el("td",{class: M.h2h[a][b]>M.h2h[b][a]?"win":""}, `${M.h2h[a][b]}–${M.h2h[b][a]}`)))); });
  return el("section",{id:"testa-a-testa"}, secHead("Testa a testa","Giornate vinte da chi è nella riga contro chi è nella colonna"), el("div",{class:"card"},
    el("div",{class:"scroll"}, el("table",{class:"h2h"}, el("thead",null, el("tr",null, el("th"), ...P.map(b=>el("th",null,b)))), tb))));
}

function badSection(){
  return el("section",{id:"da-controllare"}, el("div",{class:"card warn"}, el("h3",null,"⚠️ Da controllare"),
    el("div",{class:"muted",style:"font-size:13px;margin-bottom:8px"},"Questi testi non sono stati riconosciuti e non contano: incollate il testo “Condividi” intero, o almeno il numero."),
    el("ul",null, ...M.bad.map(b=>el("li",null, el("b",null,b.player), ` · ${b.game} · ${dShort(b.day)}: `, el("code",null,b.raw.slice(0,160)))))));
}

function rulesSection(){
  return el("section",{id:"regole"}, el("div",{class:"card"}, el("h3",null,"Come si contano i punti"),
    el("ul",{class:"rules"},
      el("li",null,"Per ogni gioco e ogni giorno si fa una classifica: 5 punti al primo, 3 al secondo, 2 al terzo, 1 al quarto (e 0 al quinto, se un giorno tornate in cinque). A pari merito, stessi punti."),
      el("li",null,"🏔️ Farhike: vince chi fa più km. 🧭 City Angle: vince chi fa più pts. 🗺️ Travle: vince chi fa meno tentativi in più (“+N”); ogni aiuto conta come un tentativo; chi non arriva è dietro a tutti."),
      el("li",null,"La giornata la vince chi somma più punti sui tre giochi (massimo 18, stelle comprese). Ultimo = cucchiaio di legno 🥄."),
      el("li",null,"⭐ Partita perfetta, +1 punto: Farhike con tutti e 5 i paesi trovati (nessun ⬛), City Angle con 3 città al primo tentativo (🟩🟩🟩), Travle con +0."),
      el("li",null,"A parità di punteggio decidono i quadratini: a Farhike vince chi ha trovato paesi più rari, a City Angle chi ha usato meno tentativi, a Travle chi ha fatto meno 🟥 e meno 🟧."),
      el("li",null,"Chi non gioca prende 0 per quel gioco."))));
}

readHash();
render();
function loadLive(){
  if(!SHEET_CSV_URL) return;
  fetch(SHEET_CSV_URL+(SHEET_CSV_URL.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(t=>{ if(/^\s*"?Giorno"?,/i.test(t) && (t!==D.csv || !D.live)){ D.csv=t; D.updatedAt=new Date().toISOString(); D.live=true; render(); } else if(D.live){ D.updatedAt=new Date().toISOString(); } })
    .catch(()=>{});
}
loadLive();
setInterval(loadLive, 5*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadLive(); });
addEventListener("hashchange",()=>{ readHash(); render(); });
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{const b=document.getElementById("trendchart"); if(b) drawTrend(b,b.querySelector(".tip"));},150);});
})();
</script>
</body>
</html>
