<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Ne(r)d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#efede7; --border:#e2e0d8;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --gold:#b98200; --accent:#2a78d6;
  --p0:#2a78d6; --p1:#eb6834; --p2:#1baf7a; --p3:#eda100; --p4:#e87ba4;
  --grid:#e6e4dd;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c85;
    --gold:#f2b632; --accent:#3987e5;
    --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181;
    --grid:#2a2a28;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --border:#2f2f2c;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c85;
  --gold:#f2b632; --accent:#3987e5;
  --p0:#3987e5; --p1:#d95926; --p2:#199e70; --p3:#c98500; --p4:#d55181;
  --grid:#2a2a28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3,.big{font-family:"Space Grotesk",Inter,sans-serif}
h1{font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:-.02em;line-height:1}
h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--text-2);margin-top:8px}
.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--text-2)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.gday{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
@media (max-width:760px){.gday{grid-template-columns:1fr}.barcell{display:none}}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
section{margin-top:26px}
.hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hero .big{font-size:28px;font-weight:700;margin-top:6px;line-height:1.1}
.hero .note{color:var(--text-2);font-size:13px;margin-top:6px}
.hero.king{background:linear-gradient(135deg,color-mix(in oklab,var(--gold) 18%,var(--surface)),var(--surface))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.name{font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.barcell{width:38%;min-width:110px}
.bar{height:10px;border-radius:0 4px 4px 0;min-width:2px}
.medal{font-size:18px;width:28px;text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--text-2);margin-left:6px;font-variant-numeric:tabular-nums}
.pill.p5{background:color-mix(in oklab,var(--gold) 28%,var(--surface));color:var(--text)}
.raw{font-variant-numeric:tabular-nums}
.absent{color:var(--muted)}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.daynav button,.btn{font:inherit;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 12px;cursor:pointer}
.daynav button:disabled{opacity:.4;cursor:default}
.daynav .dlabel{font-family:"Space Grotesk";font-weight:700;font-size:18px;min-width:180px}
.cal{display:flex;flex-wrap:wrap;gap:6px}
.cal button{font:600 12px Inter;width:42px;height:46px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal button .d{font-size:10px;color:var(--muted);font-weight:500}
.cal button.sel{outline:2px solid var(--text);outline-offset:1px}
.cal button .w{width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:150px;display:none;z-index:5}
.tip .t{font-weight:600;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-2);margin-bottom:10px}
.award{display:flex;gap:12px;align-items:flex-start}
.award .ico{font-size:26px;line-height:1}
.award .who{font-weight:600;margin-top:2px}
.award .why{font-size:13px;color:var(--text-2)}
.h2h td,.h2h th{text-align:center;font-variant-numeric:tabular-nums}
.h2h td.self{color:var(--muted)}
.h2h td.win{font-weight:700}
.empty{padding:30px;text-align:center;color:var(--text-2)}
.empty .big{font-size:24px;color:var(--text);margin-bottom:6px}
.warn li{margin:4px 0}
.warn code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.share{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--surface-2);border-radius:10px;padding:12px;margin:10px 0}
.rules li{margin:4px 0;color:var(--text-2)}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);gap:10px}
.stat-row:last-child{border-bottom:none}
.toggle{position:fixed;right:14px;bottom:14px}
footer{margin-top:34px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Daily Ne(r)d 🌍</h1>
      <div class="sub">Farhike · City Angle · Travle: chi è il vero nerd della geografia?</div>
    </div>
    <div class="chips"><span class="chips" id="chips"></span><button class="chip" id="themeBtn" title="Tema chiaro/scuro" style="cursor:pointer;font:inherit;font-size:13px">◐ Tema</button></div>
  </header>

  <div id="app"></div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const D = window.DAILY_NERD || {csv:"", updatedAt:null};
const GAMES = ["Farhike","City Angle","Travle"];
const GAME_ICON = {"Farhike":"🏔️","City Angle":"🧭","Travle":"🗺️"};
const POINTS = [5,3,2,1,0];
const app = document.getElementById("app");

/* ---------- theme ---------- */
try{const t=localStorage.getItem("nerd-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx;
  try{localStorage.setItem("nerd-theme",nx);}catch(e){}
  render();
};

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") n.className=attrs[k];
    else if(k==="style") n.setAttribute("style",attrs[k]);
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.appendChild(typeof c==="object"?c:document.createTextNode(String(c))); }
  return n;
}
const fmt = (n,d=0)=> Number(n).toLocaleString("it-IT",{maximumFractionDigits:d,minimumFractionDigits:0});
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function dParts(iso){const [y,m,d]=iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d));}
function dLong(iso){const dt=dParts(iso); return GIORNI[dt.getUTCDay()]+" "+dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}
function dShort(iso){const dt=dParts(iso); return dt.getUTCDate()+" "+MESI[dt.getUTCMonth()];}

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function normDate(s){
  s=s.trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"); }
  return null;
}
function numbers(t){ return [...t.matchAll(/\d+(?:[.,]\d+)?/g)].map(x=>parseFloat(x[0].replace(",","."))); }

/* ---------- parsers: each returns {score (higher is better), show, extra:{}} or null ---------- */
const PARSE = {
  "Farhike"(raw){
    const t=raw.replace(/#\s*\d+/g," ").replace(/(expedition|spedizione|day|giorno|no\.?)\s*\d+/gi," ");
    let km=[...t.matchAll(/(\d{1,3}(?:[.,]\d+)?)\s*km/gi)].map(x=>parseFloat(x[1].replace(",",".")));
    let v = km.length? Math.max(...km) : null;
    if(v==null){ const ns=numbers(t).filter(n=>n<=600); if(ns.length) v=Math.max(...ns); }
    if(v==null) return null;
    return {score:v, show:fmt(v,1)+" km", extra:{km:v, top: v>=450}};
  },
  "City Angle"(raw){
    let v=null; const m=raw.match(/(\d[\d.,\s]*)\s*pts?\b/i);
    if(m) v=parseInt(m[1].replace(/\D/g,""),10);
    const ft=raw.match(/(\d)\s*\/\s*5\s*first/i), co=raw.match(/(\d)\s*\/\s*5\s*correct/i);
    if(v==null){ const ns=numbers(raw.replace(/\d\s*\/\s*5/g," ")); if(ns.length) v=Math.max(...ns); }
    if(v==null||isNaN(v)) return null;
    const first=ft?+ft[1]:null, corr=co?+co[1]:null;
    return {score:v, show:fmt(v)+" pts", sub: first!=null? `${first}/5 al primo colpo`+(corr!=null?` · ${corr}/5`:""):"", extra:{pts:v, first, corr, perfect:first===5}};
  },
  "Travle"(raw){
    const t=raw.replace(/#travle\w*/gi," ").replace(/#\s*\d+/g," ");
    const h=t.match(/(\d+)\s*(hint|aiut)/i); const hints=h?+h[1]:0;
    let ok=true, extra=null, away=null; let m;
    if((m=t.match(/(\d+)\s*away/i))){ ok=false; away=+m[1]; }
    else if((m=t.match(/\+\s*(\d+)/))) extra=+m[1];
    else if(/perfect|perfetto/i.test(t)) extra=0;
    else if(/fail|❌|non\s+riuscit|perso/i.test(t)){ ok=false; away=null; }
    else { const ns=numbers(t.replace(/(\d+)\s*(hint|aiut)\w*/gi," ")); if(ns.length) extra=ns[0]; }
    if(ok && extra==null) return null;
    const pen = ok ? extra + hints : 10 + (away||9)/100;
    const show = ok ? (extra===0?"Perfetto":"+"+extra) + (hints?` · ${hints}💡`:"") : "✗ "+(away!=null?away+" away":"non arrivato");
    return {score:-pen, show, extra:{ok, extra, hints, away, pen, perfect: ok&&extra===0&&hints===0}};
  }
};

/* ---------- build model ---------- */
function build(){
  const rows=parseCSV(D.csv||"").filter(r=>r.some(c=>c&&c.trim()));
  const header=(rows[0]||[]).map(s=>(s||"").trim());
  const players=header.slice(2).filter(Boolean);
  const days={}; const bad=[]; let cur=null;
  for(const r of rows.slice(1)){
    if(r[0]&&r[0].trim()){ const nd=normDate(r[0]); if(nd) cur=nd; }
    if(!cur) continue;
    const g=GAMES.find(x=>x.toLowerCase()===(r[1]||"").trim().toLowerCase());
    if(!g) continue;
    players.forEach((p,i)=>{
      const raw=(r[2+i]||"").trim(); if(!raw) return;
      const res=PARSE[g](raw);
      days[cur]=days[cur]||{}; days[cur][g]=days[cur][g]||{};
      if(res) days[cur][g][p]=Object.assign({raw},res);
      else bad.push({day:cur,game:g,player:p,raw});
    });
  }
  const dayList=Object.keys(days).filter(d=>GAMES.some(g=>days[d][g]&&Object.keys(days[d][g]).length)).sort();
  const M={players, days, dayList, bad, perDay:{}};
  const S={}; players.forEach(p=>S[p]={points:0,dayWins:0,gameWins:0,podiums:0,played:0,daysPlayed:0,spoons:0,perGame:{},cum:[],winStreak:0,bestWinStreak:0,playStreak:0,bestPlayStreak:0,perfect:0,dayPts:[]});
  players.forEach(p=>GAMES.forEach(g=>S[p].perGame[g]={n:0,sum:0,best:null,bestDay:null,wins:0,points:0,scores:[]}));
  let runW={}, runP={};
  for(const d of dayList){
    const pd={games:{}, pts:{}, played:{}, winners:[], spoons:[]};
    players.forEach(p=>{pd.pts[p]=0; pd.played[p]=0;});
    for(const g of GAMES){
      const res=(days[d][g])||{};
      const list=players.filter(p=>res[p]).sort((a,b)=>res[b].score-res[a].score);
      const ranks={};
      list.forEach((p,i)=>{ const first=list.findIndex(q=>res[q].score===res[p].score); ranks[p]=first+1; });
      pd.games[g]={res,ranks,order:list};
      list.forEach(p=>{
        const pts=POINTS[ranks[p]-1]||0; pd.pts[p]+=pts; pd.played[p]++;
        const s=S[p], pg=s.perGame[g]; s.played++; pg.n++; pg.points+=pts;
        const val = g==="Travle"? res[p].extra.pen : res[p].score;
        pg.scores.push(val); pg.sum+=val;
        const better = g==="Travle"? (pg.best==null||val<pg.best) : (pg.best==null||val>pg.best);
        if(better){pg.best=val; pg.bestDay=d; pg.bestShow=res[p].show;}
        if(ranks[p]===1 && list.length>1){ s.gameWins++; pg.wins++; }
        if(ranks[p]<=3 && list.length>1) s.podiums++;
        if(res[p].extra.perfect || (g==="Farhike"&&res[p].extra.top)) s.perfect++;
      });
    }
    const active=players.filter(p=>pd.played[p]>0);
    const mx=Math.max(...active.map(p=>pd.pts[p])), mn=Math.min(...active.map(p=>pd.pts[p]));
    pd.winners=active.filter(p=>pd.pts[p]===mx);
    if(active.length>1 && mn<mx) pd.spoons=active.filter(p=>pd.pts[p]===mn);
    players.forEach(p=>{
      const s=S[p]; s.points+=pd.pts[p]; s.cum.push(s.points); s.dayPts.push(pd.played[p]?pd.pts[p]:null);
      if(pd.played[p]){ s.daysPlayed++; runP[p]=(runP[p]||0)+1; } else runP[p]=0;
      s.bestPlayStreak=Math.max(s.bestPlayStreak,runP[p]);
      if(pd.winners.includes(p)&&active.length>1){ s.dayWins++; runW[p]=(runW[p]||0)+1; } else runW[p]=0;
      s.bestWinStreak=Math.max(s.bestWinStreak,runW[p]);
      if(pd.spoons.includes(p)) s.spoons++;
    });
    M.perDay[d]=pd;
  }
  players.forEach(p=>{S[p].winStreak=runW[p]||0; S[p].playStreak=runP[p]||0;});
  M.S=S;
  M.ranking=[...players].sort((a,b)=>S[b].points-S[a].points || S[b].dayWins-S[a].dayWins || S[b].gameWins-S[a].gameWins);
  // h2h
  M.h2h={}; players.forEach(a=>{M.h2h[a]={}; players.forEach(b=>M.h2h[a][b]=0);});
  for(const d of dayList){ const pd=M.perDay[d];
    players.forEach(a=>players.forEach(b=>{ if(a!==b&&pd.played[a]&&pd.played[b]&&pd.pts[a]>pd.pts[b]) M.h2h[a][b]++; })); }
  return M;
}

/* ---------- render ---------- */
let M=null, selDay=null;
const color = p => `var(--p${Math.max(0,M.players.indexOf(p))%5})`;
const swatch = p => el("span",{class:"dot",style:`background:${color(p)}`});
const who = p => el("span",{class:"name"},swatch(p),p);
const whoList = ps => ps.length? el("span",null, ...ps.map((p,i)=>[i?" · ":"", who(p)])) : el("span",{class:"muted"},"—");

function render(){
  M=build();
  app.innerHTML="";
  const chips=document.getElementById("chips"); chips.innerHTML="";
  const n=M.dayList.length;
  chips.append(el("span",{class:"chip"},n? `Giorno ${n}`:"Giorno 1"), el("span",{class:"chip"},`${M.players.length} sfidanti`));
  if(D.updatedAt){ const u=new Date(D.updatedAt); chips.append(el("span",{class:"chip"},"Aggiornata "+u.toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))); }
  if(!n){
    app.append(el("div",{class:"card empty"},
      el("div",{class:"big"},"🏁 Si parte!"),
      el("div",null,"Ancora nessun risultato nello sheet. Ognuno incolla nella propria cella il testo “Condividi” del gioco: la classifica si accende al prossimo aggiornamento."),
    ));
    if(M.bad.length) app.append(badSection());
    app.append(rulesSection());
    foot(); return;
  }
  if(!selDay || !M.dayList.includes(selDay)) selDay=M.dayList[n-1];
  app.append(heroSection(), standingsSection(), daySection(), trendSection(), gamesSection(), awardsSection(), h2hSection());
  if(M.bad.length) app.append(badSection());
  app.append(rulesSection());
  foot();
}
function foot(){ document.getElementById("foot").textContent="I dati arrivano dallo sheet “Daily Ne(r)d”, aggiornati ogni sera. Punteggi per giornata: 5-3-2-1-0 per gioco."; }

function heroSection(){
  const last=M.dayList[M.dayList.length-1], pd=M.perDay[last];
  const leader=M.ranking[0], S=M.S;
  const gap = M.ranking[1]!=null ? S[leader].points - S[M.ranking[1]].points : 0;
  const streaker=[...M.players].sort((a,b)=>S[b].winStreak-S[a].winStreak)[0];
  return el("section",{class:"grid g4",id:"hero"},
    el("div",{class:"card hero king"}, el("div",{class:"label"},"👑 Re del giorno · "+dLong(last)),
      el("div",{class:"big"}, whoList(pd.winners)),
      el("div",{class:"note"}, pd.winners.length? `${pd.pts[pd.winners[0]]} punti su 15`:"")),
    el("div",{class:"card hero"}, el("div",{class:"label"},"🥄 Cucchiaio di legno"),
      el("div",{class:"big"}, whoList(pd.spoons)),
      el("div",{class:"note"}, pd.spoons.length? `${pd.pts[pd.spoons[0]]} punti, si può solo salire`:"Oggi niente cucchiaio")),
    el("div",{class:"card hero"}, el("div",{class:"label"},"🏆 In testa alla generale"),
      el("div",{class:"big"}, who(leader)),
      el("div",{class:"note"}, `${S[leader].points} punti`+(M.ranking[1]? ` · +${gap} su ${M.ranking[1]}`:""))),
    el("div",{class:"card hero"}, el("div",{class:"label"},"🔥 Serie di vittorie"),
      el("div",{class:"big"}, S[streaker].winStreak? who(streaker):el("span",{class:"muted"},"—")),
      el("div",{class:"note"}, S[streaker].winStreak? `${S[streaker].winStreak} giorn${S[streaker].winStreak>1?"i":"o"} di fila al comando`:"Nessuna serie aperta"))
  );
}

function standingsSection(){
  const S=M.S, max=Math.max(1,...M.players.map(p=>S[p].points));
  const medals=["🥇","🥈","🥉"];
  const tb=el("tbody");
  M.ranking.forEach((p,i)=>{
    const s=S[p], avg=s.daysPlayed? s.points/s.daysPlayed:0;
    tb.append(el("tr",null,
      el("td",{class:"medal"}, medals[i]||String(i+1)),
      el("td",null, who(p)),
      el("td",{class:"barcell"}, el("div",{class:"bar",style:`width:${(s.points/max*100).toFixed(1)}%;background:${color(p)}`})),
      el("td",{class:"num"}, el("b",null,s.points)),
      el("td",{class:"num"}, s.dayWins),
      el("td",{class:"num"}, s.gameWins),
      el("td",{class:"num"}, fmt(avg,1)),
      el("td",{class:"num"}, `${s.daysPlayed}/${M.dayList.length}`)
    ));
  });
  return el("section",{id:"classifica"}, el("div",{class:"card"},
    el("h2",null,"Classifica generale"),
    el("div",{class:"scroll"}, el("table",null,
      el("thead",null, el("tr",null, el("th"), el("th",null,"Nerd"), el("th",{class:"barcell"},""), el("th",{class:"num"},"Punti"), el("th",{class:"num"},"Giornate vinte"), el("th",{class:"num"},"Giochi vinti"), el("th",{class:"num"},"Media/giorno"), el("th",{class:"num"},"Presenze"))),
      tb)))
  );
}

function daySection(){
  const idx=M.dayList.indexOf(selDay), pd=M.perDay[selDay];
  const go=k=>{ selDay=M.dayList[idx+k]; render(); document.getElementById("giornata").scrollIntoView({block:"nearest"}); };
  const nav=el("div",{class:"daynav"},
    el("button",{onclick:()=>go(-1), ...(idx<=0?{disabled:""}:{}) ,"aria-label":"Giorno precedente"},"←"),
    el("span",{class:"dlabel"}, `Giorno ${idx+1} · ${dLong(selDay)}`),
    el("button",{onclick:()=>go(1), ...(idx>=M.dayList.length-1?{disabled:""}:{}),"aria-label":"Giorno successivo"},"→"));
  const order=[...M.players].sort((a,b)=>pd.pts[b]-pd.pts[a]);
  const tb=el("tbody");
  order.forEach(p=>{
    const tr=el("tr",null, el("td",null, who(p), pd.winners.includes(p)&&M.players.some(q=>q!==p&&pd.played[q])?" 👑":"", pd.spoons.includes(p)?" 🥄":""));
    GAMES.forEach(g=>{
      const G=pd.games[g], r=G.res[p];
      if(!r){ tr.append(el("td",{class:"absent"},"non giocato")); return; }
      const pts=POINTS[G.ranks[p]-1]||0;
      tr.append(el("td",null, el("span",{class:"raw"},r.show), el("span",{class:"pill"+(pts===5?" p5":"")},"+"+pts), r.sub? el("div",{class:"muted",style:"font-size:12px"},r.sub):null));
    });
    tr.append(el("td",{class:"num"}, el("b",null,pd.played[p]?pd.pts[p]:"—")));
    tb.append(tr);
  });
  const share=el("div",{class:"share",id:"sharetext"}, shareText(selDay));
  const copyBtn=el("button",{class:"btn",onclick:async()=>{ try{ await navigator.clipboard.writeText(shareText(selDay)); copyBtn.textContent="Copiato ✓"; }catch(e){ copyBtn.textContent="Copia non riuscita: seleziona il testo"; } }},"📋 Copia per WhatsApp");
  // calendar
  const cal=el("div",{class:"cal"});
  M.dayList.forEach((d,i)=>{
    const w=M.perDay[d].winners;
    const b=el("button",{class:d===selDay?"sel":"",title:`${dLong(d)}: ${w.join(", ")}`,onclick:()=>{selDay=d;render();}},
      el("span",{class:"d"},dShort(d)),
      w.length===1? el("span",{class:"w",style:`background:${color(w[0])}`},w[0][0]) : el("span",{class:"w",style:"background:var(--muted)"},w.length>1?"=":"·"));
    cal.append(b);
  });
  return el("section",{id:"giornata"},
    el("div",{class:"grid gday"},
      el("div",{class:"card"}, el("h2",null,"La giornata"), nav,
        el("div",{class:"scroll"}, el("table",null,
          el("thead",null, el("tr",null, el("th",null,"Nerd"), ...GAMES.map(g=>el("th",null,GAME_ICON[g]+" "+g)), el("th",{class:"num"},"Tot"))), tb))),
      el("div",{class:"card"}, el("h2",null,"Card del giorno"), share, copyBtn)
    ),
    el("div",{class:"card",style:"margin-top:14px"}, el("h3",null,"Calendario dei re"), el("div",{class:"muted",style:"font-size:13px;margin-bottom:8px"},"Iniziale del vincitore di ogni giornata · tocca un giorno per aprirlo"), cal)
  );
}
function shareText(d){
  const pd=M.perDay[d], idx=M.dayList.indexOf(d);
  const lines=[`🌍 Daily Ne(r)d · Giorno ${idx+1} (${dLong(d)})`,""];
  const order=[...M.players].filter(p=>pd.played[p]).sort((a,b)=>pd.pts[b]-pd.pts[a]);
  const md=["🥇","🥈","🥉"];
  order.forEach((p,i)=>{ const rk=order.findIndex(q=>pd.pts[q]===pd.pts[p]); lines.push(`${md[rk]||"▫️"} ${p}: ${pd.pts[p]} pt`); });
  lines.push("");
  GAMES.forEach(g=>{ const G=pd.games[g]; const top=G.order.filter(p=>G.ranks[p]===1);
    if(top.length) lines.push(`${GAME_ICON[g]} ${g}: ${top.join(" & ")} (${G.res[top[0]].show})`); });
  if(pd.spoons.length){ lines.push(""); lines.push(`🥄 Cucchiaio: ${pd.spoons.join(" & ")}`); }
  const lead=M.ranking[0]; lines.push(`🏆 Generale: ${lead} a ${M.S[lead].points} pt`);
  return lines.join("\n");
}

function trendSection(){
  const legend=el("div",{class:"legend"}, ...M.players.map(p=>el("span",null,swatch(p),p)));
  const box=el("div",{class:"chart",id:"trendchart"}); const tip=el("div",{class:"tip"}); box.append(tip);
  const sec=el("section",{id:"andamento"}, el("div",{class:"card"}, el("h2",null,"Andamento dei punti"), el("div",{class:"muted",style:"font-size:13px;margin:-8px 0 10px"},"Punti accumulati giorno dopo giorno"), legend, box));
  requestAnimationFrame(()=>drawTrend(box,tip));
  return sec;
}
function drawTrend(box,tip){
  const W=Math.max(300,box.clientWidth), H=Math.min(320,Math.max(220,W*0.42));
  const m={l:36,r:14,t:10,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b, n=M.dayList.length;
  const max=Math.max(5,...M.players.map(p=>M.S[p].points));
  const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const x=i=> m.l + (n<=1? iw/2 : i*iw/(n-1)), y=v=> m.t + ih - v/top*ih;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  svg.setAttribute("role","img"); svg.setAttribute("aria-label","Punti accumulati per giocatore");
  const mk=(t,a)=>{const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  for(let v=0;v<=top;v+=step){ svg.append(mk("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:"var(--grid)","stroke-width":1}));
    const t=mk("text",{x:m.l-8,y:y(v)+4,"text-anchor":"end","font-size":11,fill:"var(--muted)"}); t.textContent=v; svg.append(t); }
  const every=Math.max(1,Math.ceil(n/ Math.max(2,Math.floor(iw/60))));
  M.dayList.forEach((d,i)=>{ if(i%every && i!==n-1) return; const t=mk("text",{x:x(i),y:H-6,"text-anchor":"middle","font-size":11,fill:"var(--muted)"}); t.textContent=dShort(d); svg.append(t); });
  M.players.forEach(p=>{
    const c=M.S[p].cum; const path=c.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
    if(n>1) svg.append(mk("path",{d:path,fill:"none",stroke:color(p),"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    svg.append(mk("circle",{cx:x(n-1),cy:y(c[n-1]),r:4.5,fill:color(p),stroke:"var(--surface)","stroke-width":2}));
  });
  const cross=mk("line",{y1:m.t,y2:m.t+ih,stroke:"var(--muted)","stroke-width":1,"stroke-dasharray":"3 3",visibility:"hidden"}); svg.append(cross);
  const hit=mk("rect",{x:m.l-10,y:0,width:iw+20,height:H,fill:"transparent"}); svg.append(hit);
  const show=ev=>{
    const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width;
    const i=n<=1?0:Math.max(0,Math.min(n-1,Math.round((px-m.l)/(iw/(n-1)))));
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("visibility","visible");
    tip.innerHTML=""; tip.append(el("div",{class:"t"},`Giorno ${i+1} · ${dLong(M.dayList[i])}`));
    [...M.players].sort((a,b)=>M.S[b].cum[i]-M.S[a].cum[i]).forEach(p=>tip.append(el("div",{class:"r"},el("span",null,swatch(p),p),el("b",null,M.S[p].cum[i]))));
    tip.style.display="block";
    const bx=box.clientWidth, left=x(i)*r.width/W; const tw=tip.offsetWidth;
    tip.style.left=Math.min(bx-tw, Math.max(0, left+12 > bx-tw ? left-tw-12 : left+12))+"px"; tip.style.top="8px";
  };
  hit.addEventListener("pointermove",show); hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",()=>{tip.style.display="none"; cross.setAttribute("visibility","hidden");});
  box.querySelector("svg")?.remove(); box.prepend(svg);
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }

function gamesSection(){
  const S=M.S;
  const cards=GAMES.map(g=>{
    const ps=M.players.filter(p=>S[p].perGame[g].n);
    const lower=g==="Travle";
    const avg=p=>S[p].perGame[g].sum/S[p].perGame[g].n;
    ps.sort((a,b)=> S[b].perGame[g].points-S[a].perGame[g].points || (lower? avg(a)-avg(b) : avg(b)-avg(a)));
    const rec = ps.length? ps.reduce((best,p)=>{ const v=S[p].perGame[g].best; return best==null||(lower? v<best.v : v>best.v)? {p,v,d:S[p].perGame[g].bestDay,show:S[p].perGame[g].bestShow}:best; },null):null;
    const avgShow=p=>{ const a=avg(p); return g==="Farhike"? fmt(a,0)+" km" : g==="City Angle"? fmt(a,0)+" pts" : "+"+fmt(a,1); };
    return el("div",{class:"card",id:"gioco-"+g.replace(/\s/g,"-").toLowerCase()},
      el("h2",null,GAME_ICON[g]+" "+g),
      rec? el("div",{class:"stat-row"}, el("span",{class:"muted"},"Record"), el("span",null, who(rec.p), " ", el("b",null,rec.show), el("span",{class:"muted"}," · "+dShort(rec.d)))) : null,
      ...ps.map(p=>el("div",{class:"stat-row"}, who(p), el("span",null, el("span",{class:"muted"},"media "+avgShow(p)+" · "), el("b",null,S[p].perGame[g].points+" pt"), el("span",{class:"muted"}, S[p].perGame[g].wins? ` · ${S[p].perGame[g].wins}🥇`:"")))),
      !ps.length? el("div",{class:"muted"},"Nessun risultato ancora"):null,
      lower&&ps.length? el("div",{class:"muted",style:"font-size:12px;margin-top:8px"},"Media = tentativi in più rispetto al percorso minimo (+1 per ogni aiuto)"):null
    );
  });
  return el("section",{id:"giochi"}, el("h2",null,"Gioco per gioco"), el("div",{class:"grid g3"}, ...cards));
}

function awardsSection(){
  const S=M.S, P=M.players;
  const best=(fn,dir=1,min=1)=>{ const c=P.filter(p=>fn(p)!=null); if(!c.length) return null; const v=c.map(fn); const b=dir>0?Math.max(...v):Math.min(...v); if(dir>0&&b<min) return null; return {ps:c.filter(p=>fn(p)===b), v:b}; };
  const avgG=(p,g)=> S[p].perGame[g].n? S[p].perGame[g].sum/S[p].perGame[g].n : null;
  const A=[
    ["🏔️","Re dei km","miglior media a Farhike", best(p=>avgG(p,"Farhike")), v=>fmt(v,0)+" km di media"],
    ["🧭","Bussola d'oro","miglior media a City Angle", best(p=>avgG(p,"City Angle")), v=>fmt(v,0)+" pts di media"],
    ["🗺️","Navigatore","meno tentativi in più a Travle", best(p=>avgG(p,"Travle"),-1), v=>"+"+fmt(v,1)+" di media"],
    ["🔥","Serie più lunga","giornate vinte di fila", best(p=>S[p].bestWinStreak), v=>v+" di fila"],
    ["🎯","Colpi perfetti","Travle perfetto, City Angle 5/5 al primo colpo, Farhike ≥ 450 km", best(p=>S[p].perfect), v=>v+" colpi"],
    ["📅","Stakanovista","giorni consecutivi con almeno un gioco", best(p=>S[p].bestPlayStreak), v=>v+" giorni"],
    ["🥄","Collezionista di cucchiai","più ultimi posti di giornata", best(p=>S[p].spoons), v=>v+" cucchiai"],
    ["🥈","Eterno secondo","più podi senza vincere il gioco", best(p=>S[p].podiums-S[p].gameWins), v=>v+" podi d'argento/bronzo"],
  ];
  return el("section",{id:"premi"}, el("h2",null,"Premi speciali"),
    el("div",{class:"grid g4"}, ...A.map(([ico,t,why,r,f])=>el("div",{class:"card award"}, el("div",{class:"ico"},ico),
      el("div",null, el("div",{style:"font-weight:600"},t), el("div",{class:"who"}, r? whoList(r.ps):el("span",{class:"muted"},"in palio")), el("div",{class:"why"}, r? f(r.v)+" · "+why : why))))));
}

function h2hSection(){
  const P=M.ranking;
  const tb=el("tbody");
  P.forEach(a=>{ tb.append(el("tr",null, el("th",{style:"text-align:left"},who(a)),
    ...P.map(b=> a===b? el("td",{class:"self"},"·") : el("td",{class: M.h2h[a][b]>M.h2h[b][a]?"win":""}, `${M.h2h[a][b]}–${M.h2h[b][a]}`)))); });
  return el("section",{id:"testa-a-testa"}, el("div",{class:"card"}, el("h2",null,"Testa a testa"),
    el("div",{class:"muted",style:"font-size:13px;margin:-8px 0 10px"},"Giornate in cui chi è nella riga ha fatto più punti di chi è nella colonna"),
    el("div",{class:"scroll"}, el("table",{class:"h2h"}, el("thead",null, el("tr",null, el("th"), ...P.map(b=>el("th",null,b)))), tb))));
}

function badSection(){
  return el("section",{id:"da-controllare"}, el("div",{class:"card warn"}, el("h2",null,"⚠️ Da controllare"),
    el("div",{class:"muted",style:"font-size:13px;margin-bottom:8px"},"Questi testi non sono stati riconosciuti e non contano: incollate il testo “Condividi” intero, o almeno il numero."),
    el("ul",null, ...M.bad.map(b=>el("li",null, el("b",null,b.player), ` · ${b.game} · ${dShort(b.day)}: `, el("code",null,b.raw.slice(0,160)))))));
}

function rulesSection(){
  return el("section",{id:"regole"}, el("div",{class:"card"}, el("h2",null,"Come si contano i punti"),
    el("ul",{class:"rules"},
      el("li",null,"Per ogni gioco e ogni giorno si fa una classifica: 5 punti al primo, 3 al secondo, 2 al terzo, 1 al quarto, 0 al quinto. A pari merito, stessi punti."),
      el("li",null,"🏔️ Farhike: vince chi fa più km. 🧭 City Angle: vince chi fa più pts. 🗺️ Travle: vince chi fa meno tentativi in più (“+N”); ogni aiuto conta come un tentativo; chi non arriva è dietro a tutti."),
      el("li",null,"La giornata la vince chi somma più punti sui tre giochi (massimo 15). Ultimo = cucchiaio di legno 🥄."),
      el("li",null,"Chi non gioca prende 0 per quel gioco."))));
}

render();
let rt; addEventListener("resize",()=>{clearTimeout(rt); rt=setTimeout(()=>{const b=document.getElementById("trendchart"); if(b) drawTrend(b,b.querySelector(".tip"));},150);});
})();
